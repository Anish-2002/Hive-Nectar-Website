<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hive Nectar | Login</title>
  
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<header class="header">
  <div class="logo-area">
    <div class="brandmark">
      <img src="../newlogo.webp" alt="Hive Nectar Logo" class="logo-img">
    </div>
    <span class="brand-title">HIVE NECTAR</span>
  </div>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
  </button>
  <nav class="nav-links" id="navLinks">
    <a href="../index.html">Home</a>
    <a href="../pollenpop.html">PollenPop</a>
    <a href="../join.html">Join the Hive</a>
    <a href="../about.html">About</a>
    <a href="../faq.html">FAQ</a>
    <a href="../contact.html">Contact</a>
  </nav>
</header>

<main class="wrap">
  <section id="loginCard" class="card">
    <h1>Welcome to the Trial App</h1>
    <p>Please enter your name and email to start your session and load your allocated tasks.</p>
    <form id="loginForm">
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="E.g., Jane Doe" required />
      
      <label for="email">Your Email</label>
      <input type="email" id="email" placeholder="E.g., jane.doe@example.com" required />
      
      <button type="submit" class="btn" style="margin-top:15px; width:100%;">Start Trial</button>
    </form>
    <div class="trial-info-image" style="margin-top:20px;">
      <img src="PremimumEarlyAccess.png" alt="Trial Info" style="max-width:100%; border-radius:12px;" />
    </div>
  </section>

  <div id="appCard" class="hide"></div>
  <div id="tasks" class="hide"></div>
  <div id="score" class="hide"><span id="totalPoints"></span></div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="../profile.html">My Profile</a>
    <span>|</span>
    <a href="board.html">Communication Board</a>
  </div>
  <p>&copy; 2025 Hive Nectar. All rights reserved.</p>
</footer>

<script src="app.js"></script>
<script>
  // Redirect to task page after login
  const observer = new MutationObserver(() => {
    if (!document.getElementById('appCard').classList.contains('hide')) {
      window.location.href = 'trailtask.html' + window.location.search;
    }
  });
  observer.observe(document.getElementById('appCard'), { attributes: true });
</script>
</body>
</html>
