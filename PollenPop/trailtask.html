<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hive Nectar | Tasks</title>
  
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<header class="header">
  <div class="logo-area">
    <div class="brandmark">
      <img src="newlogo.webp" alt="Hive Nectar Logo" class="logo-img">
    </div>
    <span class="brand-title">HIVE NECTAR</span>
  </div>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
  </button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="pollenpop.html">PollenPop</a>
    <a href="join.html">Join the Hive</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="wrap">
  <section id="appCard" class="card">
    <div class="topbar">
      <h2 id="greeting">Hi [Name], here are your tasks:</h2>
      <div class="total-score-pill" id="score">Total Points: <span id="totalPoints">+0</span></div>
    </div>

    <div class="filter-bar">
      <div class="filter-group" id="coreFilter">
        <div class="custom-multi-select"><button class="select-btn" type="button"><span class="filter-name">Core Theme</span></button><div class="dropdown-panel hide"></div></div>
      </div>
      <div class="filter-group" id="stageFilter">
        <div class="custom-multi-select"><button class="select-btn" type="button"><span class="filter-name">Stage</span></button><div class="dropdown-panel hide"></div></div>
      </div>
      <div class="filter-group" id="tagsFilter">
        <div class="custom-multi-select"><button class="select-btn" type="button"><span class="filter-name">Sub Category</span></button><div class="dropdown-panel hide"></div></div>
      </div>
    </div>

    <div id="progressWrap" class="progress-container">
      <div class="progress-label">Progress: <span id="progressPct">0%</span></div>
      <progress id="progressBar" value="0" max="100"></progress>
    </div>

    <div id="tasks" class="tasks"></div>
    <div id="noMatchMessage" class="hide"></div>
    <div id="saveMsg" class="tiny">Syncing...</div>
  </section>

  <aside class="rightCol">
    <div class="card">
      <h3>Share / Open on Phone</h3>
      <div id="qrcode"></div>
      <button class="btn" id="feedbackBtn" style="width:100%; margin-top:15px;">Submit Feedback</button>
    </div>
  </aside>

  <div id="loginCard" class="hide"><form id="loginForm"><input id="name"><input id="email"></form></div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a>
    <span>|</span>
    <a href="board.html">Communication Board</a>
  </div>
  <p>&copy; 2025 Hive Nectar. All rights reserved.</p>
</footer>

<div id="modalOverlay" class="modal-overlay hide">
  <div id="modal" class="modal-content">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <button class="modal-close-btn">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
