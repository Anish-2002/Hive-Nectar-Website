  <main class="wrap">
    <div style="max-width: 400px; margin: 40px auto;">
        <section class="card" id="resetForm">
          <h2 class="section-title">Set New Password</h2>
          <div id="resetStatus" class="tiny" style="display:none; margin-bottom:18px; padding:12px 14px; border-radius:8px; line-height:1.55;"></div>

          <div id="resetFields">
            <p class="tiny" style="margin-bottom: 20px;">Please enter your new secure password below.</p>

            <div style="margin-bottom: 20px;">
                <label class="tiny" style="display:block; margin-bottom:5px;">New Password</label>
                <input type="password" id="newPassword" required style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
            </div>

            <button id="updateBtn" class="btn" style="width:100%; color:white; border:none; padding:12px; cursor:pointer; border-radius:8px;">Update Password</button>
          </div>
        </section>
    </div>
  </main>

<footer class="footer">

 <script type="module">
    import { supabase } from './js/supabase-config.js';
    import { showToast } from './js/app.js';

    const btn = document.getElementById('updateBtn');
    const pwInput = document.getElementById('newPassword');
    const fields = document.getElementById('resetFields');
    const statusEl = document.getElementById('resetStatus');

    const NEW_LINK = '<a href="forgot-password.html" class="btn" style="display:inline-block; margin-top:12px; text-decoration:none;">Send a new reset link</a>';

    function showProblem(title, detail) {
        statusEl.style.display = 'block';
        statusEl.style.background = '#fdf4f4';
        statusEl.style.border = '1px solid #e6bcbc';
        statusEl.style.color = '#8a3b3b';
        statusEl.innerHTML = '<strong>' + title + '</strong><br>' + detail + '<br>' + NEW_LINK;
        if (fields) fields.style.display = 'none';
    }

    // Supabase reports dead links in the URL fragment, e.g.
    // #error=access_denied&error_code=otp_expired&error_description=Email+link+is+invalid+or+has+expired
    // A good link instead carries #access_token=...&type=recovery, which the SDK consumes below.
    const frag = new URLSearchParams(location.hash.replace(/^#/, ''));
    const fragError = frag.get('error_description') || frag.get('error_code') || frag.get('error');

    let settled = false;
    let timer = null;

    function ready() {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        statusEl.style.display = 'none';
        if (fields) fields.style.display = '';
        btn.disabled = false;
        pwInput.focus();
    }

    function noSession() {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        showProblem('This reset link is invalid or has expired.',
            'Reset links work once, for 1 hour, and only in the browser that opens them. Request a fresh link and open it in this browser.');
    }

    if (fragError) {
        showProblem('This reset link is invalid or has expired.',
            'Reset links work once, for 1 hour, and only in the browser that opens them. Request a fresh link and open it in this browser.');
    } else {
        btn.disabled = true;
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) ready();
        });
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            ready();
        } else {
            // Give the SDK a bounded window to read #access_token=...&type=recovery
            timer = setTimeout(async () => {
                const { data: { session: s2 } } = await supabase.auth.getSession();
                if (s2) ready(); else noSession();
            }, 2500);
        }
    }

    btn.addEventListener('click', async () => {
        const newPassword = pwInput.value;

        if (!newPassword || newPassword.length < 6) {
            showToast('Password must be at least 6 characters.', 'error');
            return;
        }

        btn.innerText = 'Updating...';
        btn.disabled = true;

        const { error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) {
            const msg = (error.message || '').toLowerCase();
            if (msg.includes('session') || msg.includes('jwt') || msg.includes('token')) {
                showToast('Your reset link has expired or was already used.', 'error');
                showProblem('This reset link is invalid or has expired.',
                    'Nothing was changed. Request a fresh link and open it in this browser.');
            } else if (msg.includes('different from the old') || msg.includes('same password')) {
                showToast('New password must be different from your current password.', 'error');
                btn.innerText = 'Update Password';
                btn.disabled = false;
            } else {
                showToast(error.message, 'error');
                btn.innerText = 'Update Password';
                btn.disabled = false;
            }
        } else {
            showToast('Password updated! Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
    });
</script>
</body>
</html>
