  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: var(--bg);
      background-image: radial-gradient(circle at 20% 80%, rgba(200,169,110,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(200,169,110,0.08) 0%, transparent 50%);
      overflow-y: auto;
      touch-action: none;
      user-select: none;
      position: relative;
    }

    /* Site header/footer span full width inside centered flex body */
    .header, .footer { width: 100%; flex-shrink: 0; }

    /* Scene wrapper */
    #jar-scene {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 0 6px;
      overflow: visible;
    }

    #canvas {
      width: 100%;
      max-width: min(96vw, calc((100dvh - 286px) * 0.6));
      aspect-ratio: 900 / 1500;
      background: radial-gradient(ellipse 80% 90% at 50% 42%, #3d2212 0%, #1e1007 55%, #0c0704 100%);
      border-radius: 20px;
      box-shadow: 0 12px 44px rgba(0,0,0,0.30), 0 0 34px rgba(212,160,23,0.14);
      cursor: pointer;
      touch-action: none;
      display: block;
    }

    /* ─── Token Tray (below nav bar, static) ─── */
    #tray {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      width: 100%;
      padding: 10px 16px 12px;
      background: rgba(255,252,244,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200,169,110,0.35);
      z-index: 40;
      flex-shrink: 0;
    }

    /* ─── Layout: jar + control panel ─── */
    #jar-wrap {
      width: 100%; flex: 1;
      display: flex; flex-direction: column; align-items: center;
      min-height: 0;
    }

    /* Placement-mode toolbar */
    #mode-bar { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .mode-btn {
      background: rgba(200,120,30,0.10);
      border: 1px solid rgba(180,120,40,0.40);
      color: var(--primary-dark);
      padding: 6px 13px; font-size: 11.5px; font-weight: 800; letter-spacing: .03em;
      border-radius: 12px; cursor: pointer; transition: all .15s;
    }
    .mode-btn:hover { background: rgba(200,120,30,0.22); }
    .mode-btn.active { background: var(--honey-gradient); border-color: transparent; color: #fff; box-shadow: var(--honey-glow); }
    .mode-btn.ghost { opacity: .82; }

    #canvas.editing { cursor: grab; }
    #canvas.dragging { cursor: grabbing; }

    #edit-note {
      font-size: 11.5px; font-weight: 700; color: var(--primary-dark);
      opacity: .85; text-align: center; min-height: 15px;
    }

    /* Wide screens: jar beside the control panel — jar gets the height it needs */
    @media (min-width: 900px) {
      #jar-wrap { flex-direction: row; align-items: center; justify-content: center; gap: 20px; padding: 12px 18px 0; }
      #tray {
        width: 322px; max-width: 32vw;
        border: 1px solid rgba(200,169,110,0.35);
        border-bottom: 1px solid rgba(200,169,110,0.35);
        border-radius: 20px;
        background: rgba(255,252,244,0.92);
        box-shadow: 0 10px 34px rgba(0,0,0,0.10);
        padding: 16px 14px 18px;
      }
      #canvas { max-width: min(58vw, calc((100dvh - 176px) * 0.6)); }
      #tray-tokens { max-width: 292px; }
    }

    #token-count { font-size: 13px; font-weight: 800; color: var(--primary-dark); letter-spacing: .03em; }
    #token-count span { color: var(--fg); font-size: 14px; }

    #token-count-bar {
      display: flex; align-items: center; gap: 14px; margin-bottom: 8px;
    }
    #clear-btn {
      background: rgba(200, 120, 30, 0.12);
      border: 1px solid rgba(180, 120, 40, 0.4);
      color: var(--primary-dark);
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    #clear-btn:hover { background: rgba(200, 120, 30, 0.25); }

    #tray-tokens { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 95vw; }

    .tray-token {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: transparent;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
      border: none;
      cursor: pointer; touch-action: none;
      transition: transform .14s, box-shadow .14s, filter .14s;
    }
    .tray-token:hover { transform: scale(1.12); box-shadow: 0 6px 22px rgba(0,0,0,.30); filter: brightness(1.15); }
    .tray-token:active { transform: scale(.92); }
    .tray-token .t-img { width: 46px; height: 46px; object-fit: contain; pointer-events: none; }
    .tray-token.used { opacity: .35; filter: grayscale(.7); pointer-events: none; }

    #hint {
      font-size: 12px;
      color: var(--primary-dark);
      opacity: .9;
      margin-top: 7px;
      font-weight: 700;
      min-height: 17px;
      text-align: center;
      transition: color 0.2s, transform 0.2s;
    }
    #hint.alert { color: #e63946; transform: scale(1.04); }

    /* Action buttons below jar */
    #jar-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 14px;
      z-index: 50;
      flex-shrink: 0;
    }
    #jar-actions .save-btn {
      background: var(--honey-gradient);
      border: none;
      color: #fff;
      padding: 10px 26px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--honey-glow);
      transition: transform .15s;
      letter-spacing: .04em;
    }
    #jar-actions .save-btn:hover { transform: scale(1.05); }
    #jar-actions .save-btn:disabled { opacity: .5; cursor: default; transform: none; }
    #jar-actions #clear-btn2 {
      background: rgba(200, 120, 30, 0.12);
      border: 1px solid rgba(180, 120, 40, 0.4);
      color: var(--primary-dark);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      transition: all .15s;
    }
    #jar-actions #clear-btn2:hover { background: rgba(200, 120, 30, 0.25); }
    #jar-actions #png-btn {
      background: rgba(200, 120, 30, 0.12);
      border: 1px solid rgba(180, 120, 40, 0.4);
      color: var(--primary-dark);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      transition: all .15s;
    }
    #jar-actions #png-btn:hover { background: rgba(200, 120, 30, 0.25); }
    #jar-actions #png-btn:disabled { opacity: .5; cursor: default; }
  #jar-actions #share-btn {
    background: rgba(60, 150, 110, 0.16);
    border: 1.5px solid rgba(90, 200, 150, 0.45);
    color: #bff0d8;
    font-weight: 700;
    border-radius: 10px;

  }
  #jar-actions #share-btn:hover { background: rgba(60, 150, 110, 0.28); }
  #jar-actions #share-btn:disabled { opacity: .5; cursor: default; }
  #jar-actions #share-btn[hidden] { display: none; }

    /* Loading gate */
    #load-gate {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg);
      gap: 16px;
    }
    #load-gate .spin {
      width: 46px; height: 46px;
      border: 4px solid rgba(200,169,110,0.25);
      border-top: 4px solid #b8860b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #load-gate p { color: var(--primary-dark); font-weight: 800; font-size: 14px; letter-spacing: .05em; }

<script type="module">
  import { supabase } from './js/supabase-config.js';
  import './js/app.js';
  import './js/nav-auth.js';   // auth-aware header (Login ↔ Profile/Log out)

  const MAX_STICKERS = 3;
  let currentUser = null;
  let tokens = [];            // { id, name, icon, img }
  let placed = [];            // placed token objects (max 3)
  let isDirty = false;

  // ─── Free placement ───
  // 'auto' = tidy wedges (original look). 'free' = drag / rotate / resize.
  // The transform rides on the placed sticker object:
  //   fx, fy  face coords normalised to the wood ellipse (0 = centre, ±1 = rim)
  //   frot    rotation, radians
  //   fscale  sticker radius as a fraction of the wood-face radius
  const FREE_MIN = 0.10;      // smallest radius (× woodRx)
  const FREE_MAX = 1.05;      // largest radius (× woodRx)
  const FREE_DEFAULT = 0.46;
  let stickerMode = 'auto';
  let selected = -1;          // index of the sticker currently showing handles
  let drag = null;            // active pointer gesture

  // ─── View: zoom in on the wood face for fine work ───
  // The lid face is only ~20% of the 900×1500 canvas, so precision dragging at
  // full-jar scale is guesswork. Grabbing a sticker eases the view in on the
  // face (or the "Focus lid" button forces it); everything drawn is magnified
  // about the face centre, and canvasCoords()/cssPerLogical() invert it so the
  // pointer maths and the on-screen handle size stay exact at any zoom.
  const ZOOM_FOCUS = 2.15;
  const view = { zoom: 1, cx: 450, cy: 296, manual: 1 };
  function selectedSticker() {
    return (stickerMode === 'free' && selected >= 0 && selected < placed.length) ? placed[selected] : null;
  }
  function desiredZoom() {
    if (lidState.status !== 'CLOSED') return 1;          // watch the lid animation whole
    if (drag) return view.zoom;                          // never re-scale mid-gesture
    if (selectedSticker()) return ZOOM_FOCUS;
    return view.manual;
  }

  // ─── Canvas state (port of reference: custom-fitted screw lid) ───
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  // Retina: render at up to 2× the logical 900×1500 grid through a base
  // transform, so every existing drawing call keeps working in logical units.
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  canvas.width = 900 * DPR;
  canvas.height = 1500 * DPR;
  function resetTransform() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  resetTransform();

  const jar = {
    cx: 450, cy: 920,
    bodyRadius: 122,
    neckRadius: 100,
    neckTopY: 235,
    lidRestX: 450, lidRestY: 330, // tilted low edge on jar NECK TOP line (415.6)
    lidOpenX: 450, lidOpenY: 190,
    lidRadius: 187,    // fits bigger jar rim (rim radius ≈ 172)
    lidThickness: 62   // proportional skirt height
  };

  const lidState = {
    currentX: jar.lidRestX, currentY: jar.lidRestY,
    viewMix: 0, angle: 0, // 0 = perspective view, 1 = top view
    status: 'CLOSED', progress: 0, holdTimer: 0
  };

  let sealEffect = { active: false, radius: 108, alpha: 0 };
  let flyingToken = null;
  let honeyLevel = 0; // 0..1 from nectar earned / total
  let honeyDisplay = 0;   // animated fill value (rises from bottom on load)
  let honeyWavePhase = 0; // wave animation phase
  let honeySplash = 0;    // splash intensity while filling settles

  const dustParticles = Array.from({ length: 45 }, () => ({
    x: Math.random() * 900, y: Math.random() * 1500,
    radius: Math.random() * 2 + 0.8, alpha: Math.random(),
    speedY: -0.2 - Math.random() * 0.3,
    pulseSpeed: 0.01 + Math.random() * 0.02
  }));

  let honeyBubbles = [];

  const bees = [
    { x: 90,  y: 320,  scale: 1.0, angle: -0.2, orbitRadius: 24, speed: 1.2 },
    { x: 105, y: 760,  scale: 0.9, angle: 0.3,  orbitRadius: 18, speed: 1.5 },
    { x: 810, y: 360,  scale: 1.05, angle: -0.4, orbitRadius: 28, speed: 0.9 },
    { x: 85,  y: 1180, scale: 0.95, angle: 0.1,  orbitRadius: 20, speed: 1.1 },
    { x: 825, y: 800,  scale: 1.0, angle: -0.3, orbitRadius: 24, speed: 1.3 },
    { x: 800, y: 1240, scale: 1.1, angle: -0.1, orbitRadius: 16, speed: 1.0 }
  ];

  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutQuad(t) { return t * (2 - t); }

  // Polyfill: CanvasRenderingContext2D.roundRect (Chrome 99+, Safari 16+)
  if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
      if (typeof radii === 'number') radii = [radii];
      if (!Array.isArray(radii)) radii = [0];
      const r = radii[0] || 0;
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  // ─── Token icon drawing (SVG image clipped to circle) ───
  function drawTokenImage(img, x, y, radius) {
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, x - radius, y - radius, radius * 2, radius * 2);
      ctx.restore();
    } else {
      // Fallback: honey dot
      ctx.fillStyle = '#b8860b';
      ctx.beginPath();
      ctx.arc(x, y, radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Lid version of a token SVG: strips the full-bleed white background circle
  // so the icon sits directly on the lid surface (tray keeps the original).
  // All 60 bucket SVGs share the exact same disc: <circle cx="42" cy="42" r="42" fill="white"/>
  async function buildLidImage(iconUrl) {
    try {
      const res = await fetch(iconUrl);
      const svg = (await res.text())
        .replace(/<circle\s+cx="42"\s+cy="42"\s+r="42"\s+fill="white"\s*\/>/i, '');
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const img = new Image();
      img.src = URL.createObjectURL(blob);
      return img; // .complete flips when loaded; drawTokenImage checks it
    } catch {
      return null; // fall back to the original icon
    }
  }

  // Sticker radius for a given sticker count on the lid (rx = wood-face radius).
  // Each sticker fills its wedge: 1 = full cap, 2 = halves, 3 = sector slices
  // (largest circle inscribed in the wedge — 2: d=r=rx/2, 3: d=0.536rx, r=0.464rx).
  function stickerSize(count, rx) {
    if (count <= 1) return rx * 1.02;
    if (count === 2) return rx * 0.5;
    return rx * 0.464;
  }

  // ─── Honey fill: earned / total (0..1), animated height ───
  // Reference jar silhouette (280x430 viewBox) mapped to canvas coords
  const JAR_S = 2.6; // scale factor (bigger jar — 67% width, 64% height of canvas)
  const jx = (rx) => jar.cx + (rx - 140) * JAR_S;
  const jy = (ry) => jar.cy + (ry - 232) * JAR_S;

  function jarPath() {
    ctx.beginPath();
    ctx.moveTo(jx(74), jy(56));
    ctx.bezierCurveTo(jx(74), jy(82), jx(24), jy(112), jx(24), jy(164));
    ctx.lineTo(jx(24), jy(368));
    ctx.bezierCurveTo(jx(24), jy(408), jx(256), jy(408), jx(256), jy(368));
    ctx.lineTo(jx(256), jy(164));
    ctx.bezierCurveTo(jx(256), jy(112), jx(206), jy(82), jx(206), jy(56));
    ctx.closePath();
  }

  // Honeycomb lattice rows (reference polygon grid, scaled)
  const HONEYCOMB_ROWS = [
    [85,380,100,370,115,380,115,396,100,406,85,396],[115,380,130,370,145,380,145,396,130,406,115,396],
    [145,380,160,370,175,380,175,396,160,406,145,396],[175,380,190,370,205,380,205,396,190,406,175,396],
    [70,358,85,348,100,358,100,374,85,384,70,374],[100,358,115,348,130,358,130,374,115,384,100,374],
    [130,358,145,348,160,358,160,374,145,384,130,358],[160,358,175,348,190,358,190,374,175,384,160,374],
    [190,358,205,348,220,358,220,374,205,384,190,374],[85,336,100,326,115,336,115,352,100,362,85,352],
    [115,336,130,326,145,336,145,352,130,362,115,352],[145,336,160,326,175,336,175,352,160,362,145,352],
    [175,336,190,326,205,336,205,352,190,362,175,352],[70,314,85,304,100,314,100,330,85,340,70,330],
    [100,314,115,304,130,314,130,330,115,340,100,330],[130,314,145,304,160,314,160,330,145,340,130,330],
    [160,314,175,304,190,314,190,330,175,340,160,330],[190,314,205,304,220,314,220,330,205,340,190,330],
    [85,292,100,282,115,292,115,308,100,318,85,308],[115,292,130,282,145,292,145,308,130,318,115,308],
    [145,292,160,282,175,292,175,308,160,318,145,308],[175,292,190,282,205,292,205,308,190,318,175,308]
  ];

  function drawHoneycomb() {
    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.strokeStyle = 'rgba(140,60,0,0.9)';
    ctx.lineWidth = 2.2;
    HONEYCOMB_ROWS.forEach((p) => {
      ctx.beginPath();
      ctx.moveTo(jx(p[0]), jy(p[1]));
      for (let i = 2; i < p.length; i += 2) ctx.lineTo(jx(p[i]), jy(p[i + 1]));
      ctx.closePath();
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawMasonJar() {
    const x = jar.cx, y = jar.cy;
    const jarBottom = jy(408);
    const jarTop = jy(164);

    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.beginPath();
    ctx.ellipse(x, jy(424) + 16, 300, 55, 0, 0, Math.PI * 2);
    ctx.fill();

    // Honey fill — level = honeyDisplay (animated, rises from bottom on load)
    const fillTop = lerp(jarBottom, jarTop, honeyDisplay);
    ctx.save();
    jarPath();
    ctx.clip();

    // Honey-core radial gradient (reference honeyCore)
    const core = ctx.createRadialGradient(x, jy(280), 30, x, jy(300), 460);
    core.addColorStop(0, '#fffef0');
    core.addColorStop(0.06, '#fff5a0');
    core.addColorStop(0.18, '#ffe040');
    core.addColorStop(0.36, '#ffa800');
    core.addColorStop(0.58, '#e06800');
    core.addColorStop(0.78, '#b84200');
    core.addColorStop(1, '#6a2200');
    ctx.fillStyle = core;
    ctx.fillRect(jx(20), fillTop, jx(260) - jx(20), jarBottom - fillTop);

    // Wavy honey surface: rolling sea-like waves at the fill level
    // Two sine components for organic motion; always animated once filled
    const amp = 22 + honeySplash * 18;
    const waveAmp = Math.max(9, amp * (0.55 + 0.45 * honeyDisplay));
    const leftX = jx(30), rightX = jx(250);
    const topBand = fillTop - waveAmp * 2 - 30;
    // Darken the band above the wave so the wave reads as a surface edge
    ctx.fillStyle = 'rgba(120,40,0,0.35)';
    ctx.fillRect(leftX, topBand, rightX - leftX, waveAmp * 3 + 48);

    // Build the wave surface path (two summed sines = rolling sea)
    const surfPts = [];
    for (let px = leftX; px <= rightX; px += 6) {
      const wy = fillTop
        + Math.sin(px * 0.02 + honeyWavePhase) * waveAmp
        + Math.sin(px * 0.05 + honeyWavePhase * 1.7) * waveAmp * 0.45;
      surfPts.push([px, wy]);
    }
    // Honey below the wave
    ctx.fillStyle = 'rgba(255,230,120,0.55)';
    ctx.beginPath();
    ctx.moveTo(leftX, fillTop);
    surfPts.forEach(([px, wy]) => ctx.lineTo(px, wy));
    ctx.lineTo(rightX, jarBottom);
    ctx.lineTo(leftX, jarBottom);
    ctx.closePath();
    ctx.fill();
    // Wave crest foam line following the surface
    ctx.strokeStyle = 'rgba(255,250,190,0.85)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    surfPts.forEach(([px, wy], i) => (i === 0 ? ctx.moveTo(px, wy) : ctx.lineTo(px, wy)));
    ctx.stroke();
    // Soft second foam edge just below the crest
    ctx.strokeStyle = 'rgba(255,235,140,0.35)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    surfPts.forEach(([px, wy], i) => (i === 0 ? ctx.moveTo(px, wy + 9) : ctx.lineTo(px, wy + 9)));
    ctx.stroke();

    // Surface shimmer line at honey level
    const shimmer = ctx.createLinearGradient(0, fillTop - 18, 0, fillTop + 18);
    shimmer.addColorStop(0, 'rgba(255,250,180,0)');
    shimmer.addColorStop(0.5, 'rgba(255,255,200,0.9)');
    shimmer.addColorStop(1, 'rgba(255,230,100,0)');
    ctx.fillStyle = shimmer;
    ctx.beginPath();
    ctx.ellipse(x, fillTop, jx(250) - x, 21, 0, 0, Math.PI * 2);
    ctx.fill();

    // Honeycomb matrix behind honey
    drawHoneycomb();

    // Bubbles only in filled region
    honeyBubbles.forEach((b) => {
      if (b.y < fillTop) return;
      ctx.strokeStyle = `rgba(255,235,170,${b.alpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${b.alpha * 0.6})`;
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // Glass tint + edge stroke
    const edge = ctx.createLinearGradient(jx(24), 0, jx(256), 0);
    edge.addColorStop(0, 'rgba(255,218,80,0.95)');
    edge.addColorStop(0.42, 'rgba(255,248,180,0.72)');
    edge.addColorStop(0.78, 'rgba(210,140,20,0.62)');
    edge.addColorStop(1, 'rgba(140,70,5,0.90)');
    jarPath();
    ctx.fillStyle = 'rgba(255,190,60,0.08)';
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2.4;
    ctx.stroke();

    // Left edge highlight
    ctx.save();
    jarPath();
    ctx.clip();
    const lEdge = ctx.createLinearGradient(jx(20), 0, jx(120), 0);
    lEdge.addColorStop(0, 'rgba(255,252,210,0.62)');
    lEdge.addColorStop(1, 'rgba(255,240,150,0)');
    ctx.strokeStyle = lEdge;
    ctx.lineWidth = 16;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(jx(74), jy(58));
    ctx.bezierCurveTo(jx(70), jy(84), jx(28), jy(116), jx(26), jy(166));
    ctx.lineTo(jx(26), jy(368));
    ctx.stroke();
    ctx.restore();

    // Right edge shadow
    ctx.save();
    jarPath();
    ctx.clip();
    const rEdge = ctx.createLinearGradient(jx(160), 0, jx(256), 0);
    rEdge.addColorStop(0, 'rgba(120,50,0,0)');
    rEdge.addColorStop(1, 'rgba(90,38,0,0.55)');
    ctx.strokeStyle = rEdge;
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(jx(206), jy(58));
    ctx.bezierCurveTo(jx(210), jy(84), jx(252), jy(116), jx(254), jy(166));
    ctx.lineTo(jx(254), jy(368));
    ctx.stroke();
    ctx.restore();

    // Bottom glow
    const botGlow = ctx.createRadialGradient(x, jarBottom, 10, x, jarBottom, 80);
    botGlow.addColorStop(0, 'rgba(255,170,30,0.5)');
    botGlow.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = botGlow;
    ctx.beginPath();
    ctx.ellipse(x, jarBottom - 10, 100, 26, 0, 0, Math.PI * 2);
    ctx.fill();

    // Neck collar (brass, reference neckGrad)
    const neckY = jy(60);
    ctx.fillStyle = 'rgba(180,108,18,0.42)';
    ctx.strokeStyle = 'rgba(200,138,20,0.58)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.roundRect(jx(62), jy(38), jx(218) - jx(62), jy(60) - jy(38), 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(200,148,38,0.38)';
    ctx.strokeStyle = 'rgba(255,228,120,0.52)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, jy(38), jx(218) - x, Math.abs(jy(38) - jy(48)) * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,210,80,0.35)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(x, neckY, jx(218) - x, Math.abs(neckY - jy(52)) * 0.9, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Rim highlight
    ctx.fillStyle = 'rgba(255,250,190,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, jy(37), 30, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Specular highlights
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.roundRect(jx(74) - 8, jy(120), 16, 200, 8);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(jx(206) + 2, jy(140), 9, 180, 4.5);
    ctx.fill();
  }

  // ─── Wooden screw lid — two views ───
  // Perspective: reference design (viewBox 200x80 port) at rest.
  // Top view: blueprint exact circles. Dispatcher cross-fades via viewMix.
  // ─── Free placement: lid-plane maths ───
  // The closed lid is drawn as: translate(lidRest) → rotate(TILT) → translate(0, cy).
  // Face px therefore map 1:1 to canvas px (a pure rotation), which is what the
  // gesture code below relies on.
  const TILT = -0.24;
  function lidFaceMetrics() {
    const u = jar.lidRadius / 96;
    return { rx: 82 * u, ry: 16 * u, cy: -18 * u };
  }
  function faceToCanvas(fx, fy) {
    const m = lidFaceMetrics();
    const y0 = fy + m.cy;
    const c = Math.cos(TILT), s = Math.sin(TILT);
    return { x: lidState.currentX + fx * c - y0 * s, y: lidState.currentY + fx * s + y0 * c };
  }
  function canvasToFace(cx, cy) {
    const m = lidFaceMetrics();
    const dx = cx - lidState.currentX, dy = cy - lidState.currentY;
    const c = Math.cos(-TILT), s = Math.sin(-TILT);
    return { x: dx * c - dy * s, y: dx * s + dy * c - m.cy };
  }

  // Auto-fit wedge position for the i-th of `count` stickers on a face radius rx.
  function autoPlacement(i, count, rx, ry) {
    const slice = (Math.PI * 2) / count;
    const midA = i * slice + slice / 2 - Math.PI / 2;
    const dist = count === 1 ? 0 : (count === 2 ? rx * 0.5 : rx * 0.536);
    const ratio = ry === rx ? 1 : ry / rx;
    return { x: Math.cos(midA) * dist, y: Math.sin(midA) * dist * ratio, r: stickerSize(count, rx) };
  }

  // Where one placed sticker actually renders: free transform if the sticker has
  // one AND free mode is on, otherwise the classic wedge slot.
  function stickerPlacement(sticker, i, count, rx, ry) {
    const ratio = ry === rx ? 1 : ry / rx;
    if (stickerMode === 'free' && sticker.fx != null) {
      return { x: sticker.fx * rx, y: sticker.fy * ry, r: sticker.fscale * rx, rot: sticker.frot || 0, ratio, free: true };
    }
    const a = autoPlacement(i, count, rx, ry);
    return { x: a.x, y: a.y, r: a.r, rot: 0, ratio, free: false };
  }

  function drawStickerSlices(rx, ry, cy, angle) {
    ctx.save();
    ctx.translate(0, cy);
    ctx.rotate(angle);
    const count = placed.length;
    if (count > 0) {
      const slice = (Math.PI * 2) / count;
      placed.forEach((sticker, i) => {
        const p = stickerPlacement(sticker, i, count, rx, ry);

        // Wedge plate under auto-fit stickers only — a free-placed sticker is
        // painted straight onto the wood so the lid reads as a collage.
        if (!p.free) {
          const startA = i * slice - Math.PI / 2;
          const endA = startA + slice;
          ctx.save();
          ctx.fillStyle = '#fcefd2';
          ctx.strokeStyle = '#cda26f';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          if (ry === rx) ctx.arc(0, 0, rx, startA, endA);
          else ctx.ellipse(0, 0, rx, ry, 0, startA, endA);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        // Squash the sticker with the lid surface so it reads as painted on,
        // not a coin standing on top (top view: ratio = 1, no squash)
        ctx.scale(1, p.ratio);
        ctx.rotate(p.rot);
        drawTokenImage(sticker.lidImg || sticker.img, 0, 0, p.r);
        ctx.restore();
      });
    }
    ctx.restore();
  }

  // ─── Free placement: transforms, handles, gestures ───
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  // A stored transform is only trusted when it lands on the wood and has a sane
  // size. The pre-2026 writer stamped y_pos=20 / scale=1 on every row, so that
  // fingerprint is ignored — legacy layouts still open in the tidy wedge look.
  function saneTransform(xp, yp, sc) {
    if (!Number.isFinite(xp) || !Number.isFinite(yp) || !Number.isFinite(sc)) return null;
    const fx = (xp - 50) / 50, fy = (yp - 50) / 50;
    if (Math.hypot(fx, fy) > 1.15) return null;
    if (sc < FREE_MIN * 0.8 || sc > FREE_MAX * 1.05) return null;
    return { fx, fy, fscale: sc };
  }

  // Give every sticker a free transform, seeded from its automatic wedge slot,
  // so flipping to Free place never teleports the artwork.
  function seedFreeTransforms() {
    const m = lidFaceMetrics();
    if (!m.rx || !m.ry) return;
    const count = placed.length;
    placed.forEach((s, i) => {
      if (s.fx != null) return;
      const a = autoPlacement(i, count, m.rx, m.ry);
      s.fx = a.x / m.rx;
      s.fy = a.y / m.ry;
      s.frot = 0;
      s.fscale = clamp(a.r / m.rx, FREE_MIN, FREE_MAX);
    });
  }

  // Keep a sticker on the wood: less room the bigger it gets.
  function clampSticker(s) {
    const lim = clamp(1 - s.fscale * 0.42, 0.25, 0.95);
    const d = Math.hypot(s.fx, s.fy);
    if (d > lim) { s.fx = (s.fx / d) * lim; s.fy = (s.fy / d) * lim; }
  }

  // Floating handles: constant screen size, sat just outside the painted
  // ellipse. The perspective squash flattens the sticker hard, so the ring and
  // the handles use a floored half-height — otherwise the lid goes edge-on and
  // the grab targets collapse into the artwork.
  // The bitmap is 900x1500 but the jar is shown only ~240-370 CSS px wide, so
  // handles have to be sized in CSS pixels and converted or they render 4 px
  // across and cannot be grabbed. k = logical px per CSS px.
  function cssPerLogical() {
    const w = canvas.getBoundingClientRect().width;
    const k = w > 0 ? 900 / w : 1;
    return k / (view.zoom || 1);      // handles keep their on-screen size when zoomed
  }
  function handleMetrics() {
    const k = cssPerLogical();
    return {
      k,
      r: 13 * k,                                  // handle disc radius
      hit: 22 * k,                                // grab tolerance
      gap: 24 * k,                                // distance outside the sticker
      line: Math.max(2, 2.4 * k),
      font: Math.round(14 * k),
      floor: 26 * k                               // min half-height for the ring
    };
  }
  function screenRadii(p, floor) {
    return { a: p.r, b: Math.max(p.r * p.ratio, floor || 22) };
  }
  function rotateOffset(vx, vy, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return { x: vx * c - vy * s, y: vx * s + vy * c };
  }
  function handlePoints(p, c) {
    const m = handleMetrics();
    const radii = screenRadii(p, m.floor);
    const up = rotateOffset(0, -(radii.b + m.gap), p.rot);   // spin: above the sticker
    const out = rotateOffset(radii.a + m.gap, 0, p.rot);     // resize: to the side
    return {
      rot: { x: c.x + up.x, y: c.y + up.y },
      scl: { x: c.x + out.x, y: c.y + out.y },
      radii, m
    };
  }
  function drawHandle(pos, fill, glyph, m) {
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, m.r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = m.line;
    ctx.strokeStyle = '#5c3008';
    ctx.stroke();
    ctx.fillStyle = '#5c3008';
    ctx.font = 'bold ' + m.font + 'px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(glyph, pos.x, pos.y + m.k * 0.5);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  // Selection ring + handles, drawn in canvas space so they never get squashed.
  function drawStickerHandles() {
    if (stickerMode !== 'free' || lidState.status !== 'CLOSED') return;
    if (lidState.viewMix > 0.02) return;
    if (selected < 0 || selected >= placed.length) return;
    const m = lidFaceMetrics();
    const ratio = m.ry / m.rx;
    const p = stickerPlacement(placed[selected], selected, placed.length, m.rx, m.ry);
    const c = faceToCanvas(p.x, p.y);
    const hp = handlePoints(p, c);
    ctx.save();
    ctx.setLineDash([hp.m.r * 0.6, hp.m.r * 0.45]);
    ctx.lineWidth = hp.m.line;
    ctx.strokeStyle = 'rgba(255,216,120,0.95)';
    // The ring traces the artwork itself (which the tilt squashes to a sliver);
    // only the handle anchors need the reachability floor.
    const ring = screenRadii(p, 6 * hp.m.k);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, ring.a * 1.04, ring.b * 1.04, TILT + p.rot, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    drawHandle(hp.rot, '#ffe089', '\u21bb', hp.m);
    drawHandle(hp.scl, '#ffd76a', '\u2921', hp.m);
    ctx.restore();
  }

  // Which sticker (or handle) is under this canvas point?
  function pickSticker(cx, cy) {
    if (placed.length === 0) return null;
    const m = lidFaceMetrics();
    if (!m.rx || !m.ry) return null;
    const ratio = m.ry / m.rx;
    if (selected >= 0 && selected < placed.length) {
      const p = stickerPlacement(placed[selected], selected, placed.length, m.rx, m.ry);
      const c = faceToCanvas(p.x, p.y);
      const hp = handlePoints(p, c);
      if (Math.hypot(cx - hp.rot.x, cy - hp.rot.y) <= hp.m.hit) return { i: selected, kind: 'rotate', c, ratio, p };
      if (Math.hypot(cx - hp.scl.x, cy - hp.scl.y) <= hp.m.hit) return { i: selected, kind: 'scale', c, ratio, p };
    }
    for (let i = placed.length - 1; i >= 0; i--) {
      const p = stickerPlacement(placed[i], i, placed.length, m.rx, m.ry);
      const c = faceToCanvas(p.x, p.y);
      if (Math.hypot(cx - c.x, (cy - c.y) / ratio) <= p.r * 1.12) return { i, kind: 'move', c, ratio, p };
    }
    return null;
  }

  // Peel one sticker off with the lid-unscrew animation.
  function removeSticker(sticker) {
    if (!sticker || lidState.status !== 'CLOSED') return;
    const spot = placed.indexOf(sticker);
    placed = placed.filter(p => p !== sticker);
    if (selected === spot) selected = -1;
    else if (selected > spot) selected -= 1;
    isDirty = true;
    updateTrayUI();
    flyingToken = {
      targetSticker: { ...sticker },
      startX: jar.lidOpenX, startY: jar.lidOpenY,
      name: sticker.name, img: sticker.lidImg || sticker.img,
      progress: 0, isPlacing: false
    };
    lidState.status = 'OPENING';
    lidState.progress = 0;
  }

  // Rotation has no column yet, so it is mirrored per-user in localStorage and
  // upgraded to the database automatically once the DDL adds it.
  function rotKey() { return 'jar_rot_' + (currentUser ? currentUser.id : 'anon'); }
  function modeKey() { return 'jar_mode_' + (currentUser ? currentUser.id : 'anon'); }
  function saveLocalRots() {
    try {
      localStorage.setItem(rotKey(), JSON.stringify(placed.map(p => ({ id: p.id, rot: Number((p.frot || 0).toFixed(4)) }))));
    } catch (e) { /* private mode */ }
  }
  function loadLocalRots() {
    try {
      const raw = localStorage.getItem(rotKey());
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function localRotFor(id, fallback) {
    const rows = loadLocalRots();
    if (!rows || !rows.length) return fallback;
    const hit = rows.find(r => r.id === id);
    return (hit && Number.isFinite(Number(hit.rot))) ? Number(hit.rot) : fallback;
  }

  const editNoteEl = document.getElementById('edit-note');
  const modeAutoBtn = document.getElementById('mode-auto');
  const modeFreeBtn = document.getElementById('mode-free');
  const resetLayoutBtn = document.getElementById('reset-layout');
  const zoomLidBtn = document.getElementById('zoom-lid');
  function syncZoomButton() {
    if (!zoomLidBtn) return;
    const on = view.manual !== 1;
    zoomLidBtn.classList.toggle('active', on);
    zoomLidBtn.textContent = on ? 'Whole jar \u2921' : 'Focus lid \u2924';
  }

  // The hint line and the edit note otherwise say the same thing twice. While a
  // sticker is grabbed the note carries the instruction, so the hint is stashed
  // away and put back verbatim on release (alerts are never touched).
  let hintStash = null;
  function syncHintToSelection() {
    const h = document.getElementById('hint');
    if (!h) return;
    if (h.classList.contains('alert')) return;
    const grabbed = stickerMode === 'free' && selected >= 0 && selected < placed.length;
    if (grabbed) {
      if (h.textContent) { hintStash = h.textContent; h.textContent = ''; }
    } else if (hintStash != null) {
      h.textContent = hintStash;
      hintStash = null;
    }
  }

  function updateEditNote() {
    if (editNoteEl) {
      if (stickerMode !== 'free') editNoteEl.textContent = '';
      else if (placed.length === 0) editNoteEl.textContent = 'Free place: add a token, then drag it anywhere.';
      else if (selected < 0 || selected >= placed.length) editNoteEl.textContent = 'Free place on \u2014 tap a sticker to grab it.';
      else editNoteEl.textContent = 'Drag to move \u00b7 \u21bb rotate \u00b7 \u2921 resize \u00b7 double-tap to remove';
    }
    syncHintToSelection();
  }

  function setMode(mode) {
    stickerMode = (mode === 'free') ? 'free' : 'auto';
    if (stickerMode === 'free') seedFreeTransforms();
    selected = -1;
    drag = null;
    if (modeAutoBtn) modeAutoBtn.classList.toggle('active', stickerMode === 'auto');
    if (modeFreeBtn) modeFreeBtn.classList.toggle('active', stickerMode === 'free');
    canvas.classList.toggle('editing', stickerMode === 'free');
    try { localStorage.setItem(modeKey(), stickerMode); } catch (e) { /* private mode */ }
    hintEl.textContent = stickerMode === 'free'
      ? 'Free place: drag a sticker, or grab its handles to spin and size it.'
      : 'Auto-fit on — stickers snap into tidy wedges.';
    hintEl.classList.remove('alert');
    updateEditNote();
  }

  function drawLidPerspective(angle) {
    // Exact reference design (viewBox 200x80): static baked perspective
    const lr = jar.lidRadius;
    const u = lr / 96;
    const brassRx = 96 * u;
    const woodRx = 82 * u;
    const woodRy = 16 * u;
    const woodCy = -18 * u;
    const brassBotY = 22 * u;
    const shadowY = 34 * u;

    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(0, shadowY, 94 * u, 7 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    // Brass ring side
    const brassSide = ctx.createLinearGradient(0, 0, 0, brassBotY);
    brassSide.addColorStop(0, '#9a6210');
    brassSide.addColorStop(1, '#3e2202');
    ctx.fillStyle = brassSide;
    ctx.globalAlpha = 0.90;
    ctx.fillRect(-brassRx, 0, brassRx * 2, brassBotY);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#3e2202';
    ctx.beginPath();
    ctx.ellipse(0, brassBotY, brassRx, 13 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    // Brass ring top face
    const brassTop = ctx.createLinearGradient(0, -brassRx, 0, brassRx);
    brassTop.addColorStop(0, '#d8aa3c');
    brassTop.addColorStop(0.28, '#f5ce5e');
    brassTop.addColorStop(0.62, '#a07218');
    brassTop.addColorStop(1, '#664a08');
    ctx.fillStyle = brassTop;
    ctx.beginPath();
    ctx.ellipse(0, 0, brassRx, 14 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    // Inner shadow on brass
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.beginPath();
    ctx.ellipse(0, 0, woodRx, 10 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wood side depth strip
    const woodSide = ctx.createLinearGradient(0, woodCy, 0, woodCy + 20 * u);
    woodSide.addColorStop(0, '#7e4814');
    woodSide.addColorStop(1, '#3a1c04');
    ctx.fillStyle = woodSide;
    ctx.globalAlpha = 0.84;
    ctx.fillRect(-woodRx, woodCy, woodRx * 2, 20 * u);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#5c3008';
    ctx.beginPath();
    ctx.ellipse(0, woodCy + 20 * u, woodRx, 9.5 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wood top face
    const woodFace = ctx.createRadialGradient(-woodRx * 0.36, woodCy - woodRx * 0.36, 8, 0, woodCy, woodRx);
    woodFace.addColorStop(0, '#d08848');
    woodFace.addColorStop(0.32, '#ae6220');
    woodFace.addColorStop(0.68, '#8c4c10');
    woodFace.addColorStop(1, '#6a3408');
    ctx.fillStyle = woodFace;
    ctx.beginPath();
    ctx.ellipse(0, woodCy, woodRx, woodRy, 0, 0, Math.PI * 2);
    ctx.fill();

    // Concentric grain rings
    const rings = [[68, 12], [54, 9.5], [40, 7], [27, 4.6], [15, 2.5], [6, 1]];
    ctx.strokeStyle = 'rgba(65,25,3,0.20)';
    ctx.lineWidth = 1.2;
    rings.forEach(([rx, ry], i) => {
      ctx.globalAlpha = 1 - i * 0.02;
      ctx.beginPath();
      ctx.ellipse(0, woodCy, rx * u, ry * u, 0, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Radial grain lines
    ctx.strokeStyle = 'rgba(65,25,3,0.10)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(0, woodCy - 15 * u); ctx.lineTo(0, woodCy + 15 * u);
    ctx.moveTo(-48 * u, woodCy - 13 * u); ctx.lineTo(-22 * u, woodCy - 6 * u);
    ctx.moveTo(48 * u, woodCy - 13 * u); ctx.lineTo(22 * u, woodCy - 6 * u);
    ctx.moveTo(-66 * u, woodCy - 3 * u); ctx.lineTo(-38 * u, woodCy + 2 * u);
    ctx.moveTo(66 * u, woodCy - 3 * u); ctx.lineTo(38 * u, woodCy + 2 * u);
    ctx.moveTo(-68 * u, woodCy + 6 * u); ctx.lineTo(-40 * u, woodCy - 2 * u);
    ctx.moveTo(68 * u, woodCy + 6 * u); ctx.lineTo(40 * u, woodCy - 2 * u);
    ctx.stroke();

    // Highlights
    ctx.fillStyle = 'rgba(255,205,130,0.24)';
    ctx.beginPath();
    ctx.ellipse(-32 * u, woodCy - 5 * u, 26 * u, 9 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,245,168,0.30)';
    ctx.beginPath();
    ctx.ellipse(-38 * u, -4 * u, 34 * u, 4.5 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.beginPath();
    ctx.ellipse(38 * u, 5 * u, 22 * u, 3.5 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    // Screw-hole dots
    ctx.fillStyle = 'rgba(50,18,2,0.55)';
    ctx.beginPath();
    ctx.arc(0, woodCy, 2.8 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(80,32,6,0.40)';
    ctx.beginPath();
    ctx.arc(0, woodCy, 1.4 * u, 0, Math.PI * 2);
    ctx.fill();

    // Sticker slices (elliptical, on perspective face)
    drawStickerSlices(woodRx, woodRy, woodCy, angle);
  }

  function drawLidTopView(angle) {
    // Blueprint exact top view (viewBox 200x200): concentric circles
    const lr = jar.lidRadius;
    const u = lr / 96;
    const brassRx = 96 * u;
    const s = brassRx / 92; // blueprint brass r=92 → our brassRx
    const darkR = 80 * s;
    const woodR = 78 * s;

    // Outer brass ring (topBrassGrad diagonal)
    const topBrass = ctx.createLinearGradient(-brassRx, -brassRx, brassRx, brassRx);
    topBrass.addColorStop(0, '#f5ce5e');
    topBrass.addColorStop(0.5, '#d8aa3c');
    topBrass.addColorStop(1, '#664a08');
    ctx.fillStyle = topBrass;
    ctx.beginPath();
    ctx.arc(0, 0, brassRx, 0, Math.PI * 2);
    ctx.fill();

    // Dark ring (blueprint #3e2202 r=80)
    ctx.fillStyle = '#3e2202';
    ctx.beginPath();
    ctx.arc(0, 0, darkR, 0, Math.PI * 2);
    ctx.fill();

    // Wood insert (topWoodGrad r=78)
    const topWood = ctx.createRadialGradient(-woodR * 0.4, -woodR * 0.4, 8, 0, 0, woodR);
    topWood.addColorStop(0, '#d08848');
    topWood.addColorStop(0.5, '#ae6220');
    topWood.addColorStop(1, '#6a3408');
    ctx.fillStyle = topWood;
    ctx.beginPath();
    ctx.arc(0, 0, woodR, 0, Math.PI * 2);
    ctx.fill();

    // Concentric grain rings (blueprint 65,50,35,20 of 78)
    const ringRatios = [65 / 78, 50 / 78, 35 / 78, 20 / 78];
    ctx.strokeStyle = 'rgba(65,25,3,0.22)';
    ctx.lineWidth = 1.4;
    ringRatios.forEach((rr, i) => {
      ctx.globalAlpha = 1 - i * 0.03;
      ctx.beginPath();
      ctx.arc(0, 0, woodR * rr, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Center screw dot (blueprint r=4)
    ctx.fillStyle = 'rgba(50,18,2,0.6)';
    ctx.beginPath();
    ctx.arc(0, 0, 4 * s, 0, Math.PI * 2);
    ctx.fill();

    // Sheen highlight (blueprint: ellipse 70,70 rx35 ry20 rot -30 → offset (-30,-30))
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.save();
    ctx.translate(-30 * s, -30 * s);
    ctx.rotate(-0.52);
    ctx.beginPath();
    ctx.ellipse(0, 0, 35 * s, 20 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Sticker slices (circular, on top-view wood)
    drawStickerSlices(woodR, woodR, 0, angle);
  }

  function draw3DWoodenScrewLid() {
    ctx.save();
    ctx.translate(lidState.currentX, lidState.currentY);
    ctx.rotate(-0.24); // reference tilt (-14deg)
    const angle = lidState.angle;
    const vm = lidState.viewMix; // 0 = perspective, 1 = top view

    // True 3D flip: perspective squashes to edge-on line (vm 0→0.5),
    // then top view expands from that line to full circle (vm 0.5→1).
    // Only ONE view is ever visible — no cross-fade ghosting.
    if (vm < 0.5) {
      const sy = 1 - vm * 2; // 1 → 0 (perspective collapses)
      ctx.save();
      ctx.scale(1, Math.max(0.02, sy));
      drawLidPerspective(angle);
      ctx.restore();
    } else {
      const sy = (vm - 0.5) * 2; // 0 → 1 (top view expands)
      ctx.save();
      ctx.scale(1, Math.max(0.02, sy));
      drawLidTopView(angle);
      ctx.restore();
    }

    // Grip ridges on brass side (visible only in perspective half)
    if (vm < 0.5) {
      const lr = jar.lidRadius;
      const u = lr / 96;
      const brassRx = 96 * u;
      const numRidges = 22;
      ctx.strokeStyle = 'rgba(30,14,4,0.55)';
      ctx.lineWidth = 2.5;
      ctx.save();
      ctx.globalAlpha = 1 - vm * 2;
      ctx.translate(0, 7 * u);
      ctx.rotate(angle * 0.5);
      for (let i = 0; i < numRidges; i++) {
        const ra = (i / numRidges) * Math.PI * 2;
        const rx = Math.cos(ra) * brassRx;
        if (Math.sin(ra) > -0.2) {
          ctx.beginPath();
          ctx.moveTo(rx, -6 * u);
          ctx.lineTo(rx, 9 * u);
          ctx.stroke();
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    ctx.restore(); // pop tilt
  }

  function drawSealEffect() {
    if (!sealEffect.active) return;
    ctx.save();
    ctx.translate(jar.lidRestX, jar.lidRestY + 12);
    ctx.scale(1.0, 0.35);
    ctx.strokeStyle = `rgba(255,200,80,${sealEffect.alpha})`;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(0, 0, sealEffect.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawFlyingToken() {
    if (!flyingToken) return;
    const t = easeOutQuad(flyingToken.progress);
    let curX, curY;
    if (flyingToken.isPlacing) {
      curX = lerp(flyingToken.startX, jar.lidOpenX, t);
      curY = lerp(flyingToken.startY, jar.lidOpenY, t) - Math.sin(t * Math.PI) * Math.abs(jar.lidOpenY - flyingToken.startY) * 0.45;
    } else {
      // Removal: fly from open lid position to the lid rest spot
      curX = lerp(jar.lidOpenX, jar.lidRestX, t);
      curY = lerp(jar.lidOpenY, jar.lidRestY, t) - Math.sin(t * Math.PI) * Math.abs(jar.lidRestY - jar.lidOpenY) * 0.45;
    }
    ctx.save();
    ctx.translate(curX, curY);
    // Halo + icon scale with the lid so the flying token matches the
    // sticker it lands as (consistent on mobile + desktop)
    const u = jar.lidRadius / 96;
    const woodRx = 82 * u;
    const flyIcon = stickerSize(placed.length + 1, woodRx); // size it lands as
    const haloR = flyIcon * 1.85;
    ctx.fillStyle = 'rgba(255,215,0,0.4)';
    ctx.beginPath();
    ctx.arc(0, 0, haloR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.strokeStyle = '#D1D1D1';
    ctx.lineWidth = Math.max(2.5, haloR * 0.07);
    ctx.beginPath();
    ctx.arc(0, 0, flyIcon * 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    drawTokenImage(flyingToken.img, 0, 0, flyIcon);
    ctx.restore();
  }

  function drawGlowingBees(timeSec) {
    bees.forEach((b, idx) => {
      const hx = b.x + Math.cos(timeSec * b.speed + idx) * b.orbitRadius;
      const hy = b.y + Math.sin(timeSec * b.speed * 1.3 + idx) * (b.orbitRadius * 0.6);
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(b.angle + Math.sin(timeSec * 2 + idx) * 0.08);

      const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 30 * b.scale);
      glow.addColorStop(0, 'rgba(255,235,100,0.95)');
      glow.addColorStop(0.4, 'rgba(255,160,20,0.5)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 30 * b.scale, 0, Math.PI * 2);
      ctx.fill();

      const s = b.scale;
      const flap = Math.sin(timeSec * 40 + idx) * 0.2;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.ellipse(-4 * s, -12 * s, (6 + flap) * s, 14 * s, -Math.PI / 4, 0, Math.PI * 2);
      ctx.ellipse(4 * s, -12 * s, (6 - flap) * s, 14 * s, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffc400';
      ctx.beginPath();
      ctx.ellipse(0, 2 * s, 10 * s, 14 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1c1208';
      [-4, 1, 6].forEach((oy) => {
        ctx.beginPath();
        ctx.rect(-9 * s, oy * s, 18 * s, 3 * s);
        ctx.fill();
      });
      ctx.beginPath();
      ctx.arc(0, -12 * s, 6 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawDust() {
    dustParticles.forEach((p) => {
      p.y += p.speedY;
      p.alpha += Math.sin(p.y * 0.05) * p.pulseSpeed;
      if (p.y < 0) p.y = 1500;
      ctx.fillStyle = `rgba(255,220,130,${Math.max(0.1, Math.min(0.85, p.alpha))})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // ─── Animation state machine (reference port + top-view flip) ───
  function updateAnimations() {
    const speed = 0.026;

    // View zoom eases toward its target; snap the last hair so the pointer
    // mapping settles instead of creeping by fractions of a pixel.
    const wantZoom = desiredZoom();
    view.zoom += (wantZoom - view.zoom) * 0.15;
    if (Math.abs(wantZoom - view.zoom) < 0.004) view.zoom = wantZoom;

    // Honey: animate fill from bottom toward the earned level; wave on surface
    if (honeyDisplay < honeyLevel) {
      honeyDisplay = Math.min(honeyLevel, honeyDisplay + 0.006);
      honeySplash = 1; // keep splash while filling
    } else {
      honeySplash = Math.max(0, honeySplash - 0.03); // settle
    }
    honeyWavePhase += 0.06;

    if (lidState.status === 'OPENING') {
      lidState.progress += speed;
      if (lidState.progress >= 1) {
        lidState.progress = 1;
        if (flyingToken) {
          lidState.status = 'FLYING_TOKEN';
          flyingToken.progress = 0;
        } else {
          lidState.status = 'HOLDING';
          lidState.holdTimer = Date.now();
        }
      }
    } else if (lidState.status === 'FLYING_TOKEN') {
      if (flyingToken) {
        flyingToken.progress += 0.04;
        if (flyingToken.progress >= 1) {
          const tk = flyingToken.targetSticker;
          if (flyingToken.isPlacing) {
            if (placed.length < MAX_STICKERS) {
              placed.push(tk);
              isDirty = true;
              // A new sticker arrives in the tidy slot, then free place seeds its
              // transform from that same spot so nothing jumps.
              if (stickerMode === 'free') seedFreeTransforms();
              updateTrayUI();
            }
          } else {
            placed = placed.filter(p => p !== tk);
            isDirty = true;
            updateTrayUI();
          }
          flyingToken = null;
          lidState.status = 'HOLDING';
          lidState.holdTimer = Date.now();
        }
      }
    } else if (lidState.status === 'HOLDING') {
      if (Date.now() - lidState.holdTimer >= 2200) {
        lidState.status = 'CLOSING';
        lidState.progress = 1;
      }
    } else if (lidState.status === 'CLOSING') {
      lidState.progress -= speed;
      if (lidState.progress <= 0) {
        lidState.progress = 0;
        lidState.status = 'CLOSED';
        sealEffect = { active: true, radius: jar.lidRadius, alpha: 1.0 };
      }
    }

    const eased = easeOutQuad(lidState.progress);
    lidState.currentX = lerp(jar.lidRestX, jar.lidOpenX, eased);
    lidState.currentY = lerp(jar.lidRestY, jar.lidOpenY, eased);
    // View switch: perspective (0) at rest → top view (1) when open → back
    lidState.viewMix = eased;
    lidState.angle = (1 - eased) * Math.PI * 4;

    if (sealEffect.active) {
      sealEffect.radius += 1.6;
      sealEffect.alpha -= 0.04;
      if (sealEffect.alpha <= 0) sealEffect.active = false;
    }
  }

  function render(time) {
    resetTransform();
    updateAnimations();
    ctx.clearRect(0, 0, 900, 1500);
    drawScene(time);
    requestAnimationFrame(render);
  }

  // One full frame of artwork. Split out of render() so the PNG export can
  // repaint a clean frame (no floating dust or bees) before it crops — that
  // keeps the exported picture tidy and stops stray specks inflating the crop.
  let exporting = false;
  function drawScene(time) {
    // Background
    const bgGrad = ctx.createRadialGradient(jar.cx, jar.cy - 120, 80, jar.cx, jar.cy, 900);
    bgGrad.addColorStop(0, '#3d2212');
    bgGrad.addColorStop(0.5, '#1e1007');
    bgGrad.addColorStop(1, '#090402');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 900, 1500);

    // Magnify about the wood-face centre (the face rotates about its own
    // centre, so tracking it keeps the lid pinned while the zoom animates).
    const faceCentre = faceToCanvas(0, 0);
    view.cx = faceCentre.x;
    view.cy = faceCentre.y;
    if (!exporting && view.zoom !== 1) {
      ctx.translate(view.cx, view.cy);
      ctx.scale(view.zoom, view.zoom);
      ctx.translate(-view.cx, -view.cy);
    }

    if (!exporting) drawDust();
    drawMasonJar();
    draw3DWoodenScrewLid();
    drawStickerHandles();
    drawSealEffect();
    drawFlyingToken();
    if (!exporting) drawGlowingBees(time * 0.002);
  }

  // ─── Save the decorated jar as a picture ───
  // Two details make this worth having:
  //  1. the crop is found by repainting the very gradient the background uses
  //     and diffing it against the frame, so the picture frames the jar rather
  //     than a canvas that is 70% empty dark sky (and it tracks any re-skin);
  //  2. a clean frame is drawn first (no dust, no bees) so stray specks cannot
  //     inflate the crop box.
  // toDataURL() only works because the token art loads crossOrigin='anonymous'.
  function jarBounds() {
    const S = 0.25;                                    // diff at quarter scale: 337k px
    const w = Math.round(900 * S), h = Math.round(1500 * S);
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d');
    octx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, w, h);
    const art = octx.getImageData(0, 0, w, h).data;

    const ref = document.createElement('canvas');
    ref.width = w; ref.height = h;
    const rctx = ref.getContext('2d');
    const g = rctx.createRadialGradient(jar.cx * S, (jar.cy - 120) * S, 80 * S, jar.cx * S, jar.cy * S, 900 * S);
    g.addColorStop(0, '#3d2212');
    g.addColorStop(0.5, '#1e1007');
    g.addColorStop(1, '#090402');
    rctx.fillStyle = g;
    rctx.fillRect(0, 0, w, h);
    const bg = rctx.getImageData(0, 0, w, h).data;

    const TOL = 16;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const o = (y * w + x) * 4;
        if (Math.abs(art[o] - bg[o]) > TOL || Math.abs(art[o + 1] - bg[o + 1]) > TOL ||
            Math.abs(art[o + 2] - bg[o + 2]) > TOL) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
    const whole = { x: 0, y: 0, w: canvas.width, h: canvas.height };
    if (x1 < 0 || y1 < 0) return whole;
    const m = 14 / S;                                  // ~14 logical px of breathing room
    const X0 = Math.max(0, Math.floor(x0 / S - m));
    const Y0 = Math.max(0, Math.floor(y0 / S - m));
    const X1 = Math.min(canvas.width - 1, Math.ceil(x1 / S + m));
    const Y1 = Math.min(canvas.height - 1, Math.ceil(y1 / S + m));
    if (X1 - X0 < 200 || Y1 - Y0 < 200) return whole;  // implausible box → full canvas
    return { x: X0, y: Y0, w: X1 - X0, h: Y1 - Y0 };
  }

  // Renders the jar into a PNG blob: a clean, un-zoomed frame, cropped to the
  // artwork. Shared by the download and the mobile share sheet.
  function buildJarPng() {
    return new Promise((resolve, reject) => {
      exporting = true;
      resetTransform();
      drawScene(performance.now());                    // clean frame, full device resolution
      const b = jarBounds();
      const MAX = 1800;                                // cap the long edge (~1 MB PNGs)
      const k = Math.min(1, MAX / Math.max(b.w, b.h));
      const out = document.createElement('canvas');
      out.width = Math.round(b.w * k);
      out.height = Math.round(b.h * k);
      out.getContext('2d').drawImage(canvas, b.x, b.y, b.w, b.h, 0, 0, out.width, out.height);
      out.toBlob((blob) => {
        exporting = false;
        resetTransform();
        drawScene(performance.now());                  // restore the live view immediately
        if (blob) resolve({ blob, width: out.width, height: out.height });
        else reject(new Error('toBlob returned null'));
      }, 'image/png');
    });
  }

  function exportJar(wantShare) {
    const pngBtn = document.getElementById('png-btn');
    const ctl = wantShare ? document.getElementById('share-btn') : pngBtn;
    const wasLabel = ctl ? ctl.textContent : '';
    if (ctl) { ctl.disabled = true; ctl.textContent = 'SAVING…'; }
    buildJarPng().then(({ blob, width, height }) => {
      const file = new File([blob], 'my-honey-jar.png', { type: 'image/png' });
      if (wantShare && navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: 'My honey jar', text: 'My jar on The Meadow — hivenectar.earth' })
          .then(() => ({ shared: true, width, height }))
          .catch((err) => {
            if (err && err.name === 'AbortError') return { cancelled: true };
            throw err;
          });
      }
      const a = document.createElement('a');
      a.download = 'my-honey-jar.png';
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      return { downloaded: true, width, height };
    }).then((res) => {
      if (!res || res.cancelled) return;
      if (hintEl) {
        hintEl.classList.remove('alert');
        hintEl.textContent = res.shared
          ? 'Jar shared!'
          : 'Picture saved — ' + res.width + '×' + res.height + ' px PNG.';
      }
    }).catch((err) => {
      console.error('Jar export failed:', err);
      if (hintEl) {
        hintEl.textContent = 'Could not build the picture — try again.';
        hintEl.classList.add('alert');
      }
    }).finally(() => {
      exporting = false;
      if (ctl) { ctl.disabled = false; ctl.textContent = wasLabel || (wantShare ? 'Share' : 'Save picture ⤓'); }
    });
  }

  // ─── Click handling ───
  function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    let x = (e.clientX - rect.left) * (900 / rect.width);
    let y = (e.clientY - rect.top) * (1500 / rect.height);
    if (view.zoom !== 1) {                       // undo the render-time zoom
      x = view.cx + (x - view.cx) / view.zoom;
      y = view.cy + (y - view.cy) / view.zoom;
    }
    return { x, y };
  }

  // ─── Pointer gestures (Free place) + click (Auto-fit) ───
  let suppressClickUntil = 0;

  canvas.addEventListener('pointerdown', (e) => {
    if (stickerMode !== 'free' || lidState.status !== 'CLOSED') return;
    const { x, y } = canvasCoords(e);
    const hit = pickSticker(x, y);
    if (!hit) {                       // tap the wood -> drop the selection
      selected = -1;
      updateEditNote();
      return;
    }
    selected = hit.i;
    const s = placed[hit.i];
    if (!s || s.fx == null) return;
    const m = lidFaceMetrics();
    const face = canvasToFace(x, y);
    drag = {
      i: hit.i, kind: hit.kind, c: hit.c, ratio: hit.ratio, r0: hit.p.r,
      moved: false, startX: x, startY: y,
      faceX: face.x, faceY: face.y,
      fx0: s.fx, fy0: s.fy, fscale0: s.fscale, frot0: s.frot || 0,
      grabAngle: Math.atan2((y - hit.c.y) / hit.ratio, x - hit.c.x),
      grabDist: Math.max(8, Math.hypot(x - hit.c.x, (y - hit.c.y) / hit.ratio))
    };
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* no capture */ } }
    canvas.classList.add('dragging');
    updateEditNote();
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const { x, y } = canvasCoords(e);
    if (Math.hypot(x - drag.startX, y - drag.startY) > 3) drag.moved = true;
    const s = placed[drag.i];
    if (!s) { drag = null; return; }
    const m = lidFaceMetrics();
    if (drag.kind === 'move') {
      const face = canvasToFace(x, y);
      s.fx = drag.fx0 + (face.x - drag.faceX) / m.rx;
      s.fy = drag.fy0 + (face.y - drag.faceY) / m.ry;
      clampSticker(s);
    } else if (drag.kind === 'rotate') {
      // Angle travels with the cursor: relative, so grab-and-spin is direct.
      const a = Math.atan2((y - drag.c.y) / drag.ratio, x - drag.c.x);
      let rot = drag.frot0 + (a - drag.grabAngle);
      if (e.shiftKey) rot = Math.round(rot / (Math.PI / 12)) * (Math.PI / 12); // 15° snap
      rot = normalizeAngle(rot);
      if (Math.abs(rot) < 0.06) rot = 0;   // settle back to upright
      s.frot = rot;
    } else if (drag.kind === 'scale') {
      // Relative resize: the sticker tracks the handle 1:1.
      const d = Math.hypot(x - drag.c.x, (y - drag.c.y) / drag.ratio);
      s.fscale = clamp(drag.fscale0 * (d / drag.grabDist), FREE_MIN, FREE_MAX);
      clampSticker(s);
    }
    e.preventDefault();
  });

  function endDrag(e) {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    canvas.classList.remove('dragging');
    if (e && e.pointerId != null && canvas.releasePointerCapture) {
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
    }
    if (moved) { isDirty = true; suppressClickUntil = Date.now() + 300; }
    updateEditNote();
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // Double-tap a sticker in Free place to peel it off.
  // Keyboard parity: nudge, rotate, resize, delete the grabbed sticker.
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.closest && e.target.closest('input, textarea, select')) return;
    const p = placed[selected];
    if (stickerMode !== 'free' || !p || lidState.status !== 'CLOSED') return;
    const fine = e.shiftKey ? 0.02 : 0.08;
    const rotStep = e.shiftKey ? 0.02 : 0.09;
    const sizeStep = e.shiftKey ? 0.01 : 0.05;
    const act = (fn) => { e.preventDefault(); if (p.fx == null) seedFreeTransforms(); fn(); clampSticker(p); isDirty = true; updateTrayUI(); updateEditNote(); };
    switch (e.key) {
      case 'ArrowLeft':  act(() => { p.fx -= fine; }); break;
      case 'ArrowRight': act(() => { p.fx += fine; }); break;
      case 'ArrowUp':    act(() => { p.fy -= fine; }); break;
      case 'ArrowDown':  act(() => { p.fy += fine; }); break;
      case 'q': case 'Q': act(() => { p.frot = normalizeAngle((p.frot || 0) - rotStep); }); break;
      case 'e': case 'E': act(() => { p.frot = normalizeAngle((p.frot || 0) + rotStep); }); break;
      case '+': case '=': act(() => { p.fscale = Math.min(FREE_MAX, (p.fscale || 1) + sizeStep); }); break;
      case '-': case '_': act(() => { p.fscale = Math.max(FREE_MIN, (p.fscale || 1) - sizeStep); }); break;
      case 'Escape': e.preventDefault(); selected = -1; updateEditNote(); break;
      case 'Delete': case 'Backspace': e.preventDefault(); removeSticker(p); break;
      default: break;
    }
  });

  canvas.addEventListener('dblclick', (e) => {
    if (stickerMode !== 'free' || lidState.status !== 'CLOSED') return;
    const { x, y } = canvasCoords(e);
    const hit = pickSticker(x, y);
    if (hit) removeSticker(placed[hit.i]);
  });

  canvas.addEventListener('click', (e) => {
    if (Date.now() < suppressClickUntil) return;
    if (lidState.status !== 'CLOSED') return;
    if (stickerMode === 'free') return;   // selection is handled on pointerdown
    const { x, y } = canvasCoords(e);

    // Click closed lid -> remove last sticker
    if (Math.hypot(x - jar.lidRestX, y - jar.lidRestY) <= jar.lidRadius * 1.1) {
      if (placed.length > 0) removeSticker(placed[placed.length - 1]);
    }
  });

  // ─── Tray UI ───
  const trayTokensEl = document.getElementById('tray-tokens');
  const stickerNumEl = document.getElementById('sticker-num');
  const hintEl = document.getElementById('hint');

  function updateTrayUI() {
    stickerNumEl.textContent = placed.length;
    document.querySelectorAll('.tray-token').forEach((btn) => {
      const id = btn.dataset.tokenId;
      btn.classList.toggle('used', placed.some(p => p.id === id));
    });
    const free = stickerMode === 'free';
    if (placed.length === MAX_STICKERS) {
      hintEl.textContent = free
        ? 'Lid is full — drag a sticker, or double-tap one to peel it off.'
        : 'Lid is full! Click the lid to peel off a sticker.';
      hintEl.classList.remove('alert');
    } else if (placed.length === 0) {
      hintEl.textContent = 'Tap a token below — watch the lid unscrew and fit it on!';
      hintEl.classList.remove('alert');
    } else {
      hintEl.textContent = free
        ? `${placed.length}/${MAX_STICKERS} on the lid — drag them anywhere you like.`
        : `${placed.length}/${MAX_STICKERS} on the lid. Click the lid to remove one.`;
      hintEl.classList.remove('alert');
    }
    updateEditNote();
  }

  function spawnTray() {
    trayTokensEl.innerHTML = '';
    tokens.forEach((tk) => {
      const btn = document.createElement('button');
      btn.className = 'tray-token';
      btn.dataset.tokenId = tk.id;
      btn.innerHTML = `<img class="t-img" src="${tk.icon}" alt="${tk.name}" title="${tk.name}" onerror="this.style.display='none'">`;
      btn.addEventListener('click', (e) => {
        if (lidState.status !== 'CLOSED' || placed.length >= MAX_STICKERS || placed.some(p => p.id === tk.id)) {
          if (placed.length >= MAX_STICKERS) {
            hintEl.textContent = 'The lid is full! Click the lid to peel off a sticker first.';
            hintEl.classList.add('alert');
          }
          return;
        }
        // Map tray button position to canvas coords for flight start
        const rect = canvas.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        const sx = (bRect.left + bRect.width / 2 - rect.left) * (900 / rect.width);
        // Clamp start so the token always begins just above the canvas,
        // regardless of tray position (consistent on mobile + desktop)
        let sy = (bRect.top + bRect.height / 2 - rect.top) * (1500 / rect.height);
        let sxv = sx;
        if (view.zoom !== 1) {                 // match the rendered (zoomed) frame
          sxv = view.cx + (sx - view.cx) / view.zoom;
          sy = view.cy + (sy - view.cy) / view.zoom;
        }
        sy = Math.min(sy, jar.lidOpenY - 120);
        flyingToken = {
          targetSticker: tk,
          startX: sxv, startY: sy,
          name: tk.name, img: tk.lidImg || tk.img,
          progress: 0, isPlacing: true
        };
        lidState.status = 'OPENING';
        lidState.progress = 0;
      });
      // Mobile: pointerdown fires instantly on touch (no 300ms delay,
      // reliable with touch-action:none) — guard against double-fire
      btn.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'touch') return;
        e.preventDefault();
        btn.click();
      });
      trayTokensEl.appendChild(btn);
    });
    if (tokens.length === 0) {
      trayTokensEl.innerHTML = '<div style="color:var(--primary-dark);font-size:12px;font-weight:700;padding:8px;text-align:center;">No tokens yet — <a href="profile.html" style="color:var(--primary-dark);text-decoration:underline;font-weight:900;">earn and reveal tokens on your profile</a> first!</div>';
    }
    updateTrayUI();
  }

  // ─── Save / Load ───
  const saveBtn = document.getElementById('saveBtn');
  const clearBtn = document.getElementById('clear-btn');
  const clearBtn2 = document.getElementById('clear-btn2');

  async function saveLid() {
    if (!currentUser) return;
    saveBtn.disabled = true;
    saveBtn.textContent = 'SAVING…';
    try {
      // Real geometry: x_pos/y_pos are percent across the wood face (50,50 =
      // centre), scale is the sticker radius as a fraction of the face radius,
      // rotation is radians. The RPC ignores unknown keys, so `rotation` is
      // harmless until the DDL adds the column — a local mirror covers the gap.
      const decorations = placed.map((p) => ({
        token_id: p.id,
        x_pos: p.fx == null ? 50 : clamp(Math.round((50 + p.fx * 50) * 100) / 100, 0, 100),
        y_pos: p.fy == null ? 50 : clamp(Math.round((50 + p.fy * 50) * 100) / 100, 0, 100),
        scale: p.fscale == null ? 1 : Math.round(p.fscale * 1000) / 1000,
        rotation: Number((p.frot || 0).toFixed(4))
      }));
      const { error } = await supabase.rpc('save_jar_decorations', {
        p_user_id: currentUser.id,
        p_decorations: decorations
      });
      if (error) throw error;
      isDirty = false;
      saveLocalRots();
      hintEl.textContent = 'Lid saved to cloud!';
      hintEl.classList.remove('alert');
    } catch (err) {
      console.error('Save error:', err);
      hintEl.textContent = 'Save failed — please try again.';
      hintEl.classList.add('alert');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'SAVE LID';
    }
  }

  async function loadSavedLid() {
    if (!currentUser) return;
    // 'rotation' only exists once the rotation DDL runs — fall back to the
    // pre-DDL column set so the page keeps working either way.
    let saved = null, error = null, hasRotation = true;
    ({ data: saved, error } = await supabase
      .from('user_jar_decorations')
      .select('token_id, x_pos, y_pos, scale, rotation')
      .eq('user_id', currentUser.id));
    if (error) {
      hasRotation = false;
      ({ data: saved, error } = await supabase
        .from('user_jar_decorations')
        .select('token_id, x_pos, y_pos, scale')
        .eq('user_id', currentUser.id));
    }
    if (error || !saved) return;
    // Every stored row from the legacy writer looks like y_pos=20 / scale=1:
    // that is not a real placement, so those rows open in the tidy wedge look.
    const legacyLayout = saved.length > 0 &&
      saved.every(d => Number(d.y_pos) === 20 && Number(d.scale) === 1);
    const tokenMap = new Map(tokens.map(t => [t.id, t]));
    saved.forEach((d) => {
      const tk = tokenMap.get(d.token_id);
      if (!tk || placed.length >= MAX_STICKERS || placed.some(p => p.id === tk.id)) return;
      const next = { ...tk };
      if (!legacyLayout) {
        const t = saneTransform(Number(d.x_pos), Number(d.y_pos), Number(d.scale));
        if (t) { next.fx = t.fx; next.fy = t.fy; next.fscale = t.fscale; }
      }
      if (next.fx != null) {
        let rot = localRotFor(next.id, 0);
        if (hasRotation && d.rotation != null && Number.isFinite(Number(d.rotation))) rot = Number(d.rotation);
        next.frot = Number.isFinite(rot) ? normalizeAngle(rot) : 0;
      }
      placed.push(next);
    });
    updateTrayUI();
    updateEditNote();
  }

  // ─── Honey level: earned nectar / total nectar (all tasks) ───
  async function loadHoneyLevel() {
    try {
      const [{ data: tasks }, { data: profile }] = await Promise.all([
        supabase.from('tasks').select('nectar_reward'),
        supabase.from('profiles').select('nectar_points').eq('id', currentUser.id).maybeSingle()
      ]);
      const total = (tasks || []).reduce((s, t) => s + (Number(t.nectar_reward) || 0), 0);
      const earned = profile ? Number(profile.nectar_points) || 0 : 0;
      honeyLevel = total > 0 ? Math.min(1, Math.max(0, earned / total)) : 0;
      honeyDisplay = 0;   // start empty; animates up to honeyLevel in updateAnimations
      honeySplash = 1;    // wave splash while filling
      // Honey bubbles span the fillable region (reference jar silhouette)
      honeyBubbles = Array.from({ length: 55 }, () => ({
        x: jx(24) + (jx(256) - jx(24)) * Math.random(),
        y: jy(120) + (jy(408) - jy(120)) * Math.random(),
        r: Math.random() * 18 + 6,
        alpha: 0.3 + Math.random() * 0.5
      }));
    } catch (err) {
      console.error('Honey level error:', err);
    }
  }

  function clearAllStickers() {
    if (placed.length === 0 || lidState.status !== 'CLOSED') return;
    placed = [];
    selected = -1;
    drag = null;
    isDirty = true;
    try { localStorage.removeItem(rotKey()); } catch (e) { /* private mode */ }
    updateTrayUI();
    updateEditNote();
  }

  clearBtn.addEventListener('click', clearAllStickers);
  if (clearBtn2) clearBtn2.addEventListener('click', clearAllStickers);
  saveBtn.addEventListener('click', saveLid);
  const pngBtn = document.getElementById('png-btn');
  if (pngBtn) pngBtn.addEventListener('click', () => exportJar(false));
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) {
    // Only offer Share where the browser can actually hand the file to an app
    // (mobile share sheets). Desktop keeps the plain download.
    const probe = new File([new Blob(['x'])], 'p.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [probe] })) {
      shareBtn.hidden = false;
      shareBtn.addEventListener('click', () => exportJar(true));
    }
  }

  // ─── Placement mode wiring ───
  if (modeAutoBtn) modeAutoBtn.addEventListener('click', () => setMode('auto'));
  if (modeFreeBtn) modeFreeBtn.addEventListener('click', () => setMode('free'));
  if (zoomLidBtn) zoomLidBtn.addEventListener('click', () => {
    view.manual = view.manual === 1 ? ZOOM_FOCUS : 1;
    syncZoomButton();
    hintEl.textContent = view.manual === 1
      ? 'Whole jar — the lid is drawn at full scale.'
      : 'Focused on the lid — grab a sticker to fine-tune it.';
    hintEl.classList.remove('alert');
  });
  syncZoomButton();
  if (resetLayoutBtn) resetLayoutBtn.addEventListener('click', () => {
    // Re-seed from the tidy wedges: keeps the tokens, drops the hand-placing.
    placed.forEach((s) => { s.fx = null; s.fy = null; s.frot = 0; s.fscale = null; });
    if (stickerMode === 'free') seedFreeTransforms();
    selected = -1;
    drag = null;
    isDirty = true;
    try { localStorage.removeItem(rotKey()); } catch (e) { /* private mode */ }
    hintEl.textContent = 'Layout reset to tidy wedges.';
    hintEl.classList.remove('alert');
    updateEditNote();
  });

  // ─── Init ───
  async function init() {
    try {
      const { data: { user }, error: authErr } = await supabase.auth.getUser();
      if (authErr || !user) {
        window.location.replace('login.html');
        return;
      }
      currentUser = user;

      // ALL owned tokens (revealed + previously earned)
      const { data: userTokens } = await supabase
        .from('user_tokens')
        .select('token_id')
        .eq('user_id', user.id);

      const tokenIds = (userTokens || []).map(ut => ut.token_id);
      if (tokenIds.length > 0) {
        const { data: tokenDefs } = await supabase
          .from('tokens')
          .select('id, name, icon_url')
          .in('id', tokenIds)
          .eq('active', true);
        tokens = (tokenDefs || []).map(t => {
          const img = new Image();
          if (t.icon_url) {
            // CORS-clean load: the art is drawn onto the canvas, so without this
            // the canvas is tainted and toDataURL()/toBlob() (export + share)
            // throw SecurityError. Storage sends ACAO:* for public objects.
            img.crossOrigin = 'anonymous';
            img.onerror = () => {                 // art first: fall back to a plain load
              if (img.crossOrigin === null) return;
              img.crossOrigin = null;
              img.src = t.icon_url;
            };
            img.src = t.icon_url;
          }
          const tk = { id: t.id, name: t.name, icon: t.icon_url || '', img, lidImg: img };
          if (t.icon_url) {
            buildLidImage(t.icon_url).then(lidImg => {
              if (lidImg) tk.lidImg = lidImg;
            });
          }
          return tk;
        });
      }

      spawnTray();
      await loadSavedLid();
      let savedMode = 'auto';
      try { savedMode = localStorage.getItem(modeKey()) === 'free' ? 'free' : 'auto'; } catch (e) { /* private mode */ }
      setMode(savedMode);
      await loadHoneyLevel();
      document.getElementById('load-gate').style.display = 'none';
      // Fail-loud: if render throws, surface it — never leave a silent static jar
      try {
        requestAnimationFrame(render);
      } catch (err) {
        console.error('Render start error:', err);
        hintEl.textContent = 'Canvas error — see console.';
        hintEl.classList.add('alert');
      }
    } catch (err) {
      console.error('Init error:', err);
      document.getElementById('load-gate').style.display = 'none';
      hintEl.textContent = 'Failed to load tokens.';
      hintEl.classList.add('alert');
    }
  }

  init();
</script>
</body>
</html>
