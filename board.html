<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Communication Board | Hive Nectar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* Adding a few helper styles for the comments you requested */
    .comment-section { margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border); }
    .comment-item { font-size: 0.85rem; background: #f8fafc; padding: 8px; border-radius: 8px; margin-bottom: 5px; color: var(--fg); }
    .comment-input-wrap { display: flex; gap: 8px; margin-top: 10px; }
    .comment-input { flex-grow: 1; padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; }
    .comment-btn { background: var(--primary); border: none; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
  </style>
</head>
<body>
<header class="header">
  <div class="logo-area">
    <div class="brandmark"><img src="logo.svg" alt="" style="width:20px;"></div>
    <span class="brand-title">HIVE NECTAR</span>
  </div>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu"><i class="fas fa-bars"></i></button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="pollenpop.html">PollenPop</a>
    <a href="join.html">Join the Hive</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="wrap">
    <div class="filter-navigation">
        <button class="pill active">All Buzz</button>
        <button class="pill">Announcements</button>
        <button class="pill">Community</button>
        <button class="pill">System Updates</button>
    </div>

    <div class="board-container-full" id="dynamicBoard">
        </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a>
    <span>|</span>
    <a href="board.html">Communication Board</a>
  </div>
  <p>&copy; 2025 Hive Nectar. All rights reserved.</p>
</footer>

<script>
    // Initial data matching your JSON structure
    const defaultData = {
      "posts": [
        {
          "id": "1",
          "title": "PollenPop is available for early access! 🚀",
          "short_desc": "Be the first to experience our new physical product line. Early hive members get a 20% discount on their first harvest.",
          "created_at": new Date().toISOString(),
          "comments": []
        }
      ]
    };

    function loadBoard() {
        const board = document.getElementById('dynamicBoard');
        const data = JSON.parse(localStorage.getItem('admin_comms')) || defaultData;
        
        board.innerHTML = '';

        data.posts.forEach((post, index) => {
            const timeLabel = new Date(post.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Design Choice: First post uses the "Hero" style, others use "Rectangular" style
            if (index === 0) {
                board.innerHTML += `
                <section class="card glass-card announcement-hero">
                    <div class="announcement-content">
                        <div class="badge-row">
                            <span class="status-btn complete">New Update</span>
                            <span class="tiny muted">Just Now</span>
                        </div>
                        <h2>${post.title}</h2>
                        <p>${post.short_desc}</p>
                        <div class="announcement-actions">
                            <button class="reaction-btn"><i class="fas fa-heart"></i> Reaction</button>
                        </div>
                        ${renderComments(post)}
                    </div>
                    <div class="announcement-visual">
                        <i class="fas fa-bullhorn fa-5x" style="color: var(--primary); opacity: 0.5;"></i>
                    </div>
                </section>`;
            } else {
                board.innerHTML += `
                <section class="card glass-card rectangular-update">
                    <div class="update-header-row">
                        <div class="update-title">
                            <div class="dot green"></div>
                            <h3 style="margin:0; font-size: 1.1rem;">${post.title}</h3>
                        </div>
                        <span class="tiny muted">${timeLabel}</span>
                    </div>
                    <p class="muted">${post.short_desc}</p>
                    ${renderComments(post)}
                </section>`;
            }
        });
    }

    function renderComments(post) {
        const commentsHtml = (post.comments || []).map(c => `<div class="comment-item"><strong>Bee:</strong> ${c}</div>`).join('');
        return `
            <div class="comment-section">
                <div id="comment-list-${post.id}">${commentsHtml}</div>
                <div class="comment-input-wrap">
                    <input type="text" id="input-${post.id}" class="comment-input" placeholder="Add a comment...">
                    <button class="comment-btn" onclick="addComment('${post.id}')">Send</button>
                </div>
            </div>
        `;
    }

    window.addComment = function(postId) {
        const input = document.getElementById(`input-${postId}`);
        if (!input.value.trim()) return;

        const data = JSON.parse(localStorage.getItem('admin_comms')) || defaultData;
        const post = data.posts.find(p => p.id === postId);
        if (!post.comments) post.comments = [];
        
        post.comments.push(input.value);
        localStorage.setItem('admin_comms', JSON.stringify(data));
        loadBoard();
    };

    document.addEventListener('DOMContentLoaded', loadBoard);
</script>
<script src="app.js"></script>
</body>
</html>
