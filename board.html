<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Communication Board | Hive Nectar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .comment-section { margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border); }
    .comment-item { font-size: 0.85rem; background: #f8fafc; padding: 8px; border-radius: 8px; margin-bottom: 5px; color: var(--fg); }
    .comment-input-wrap { display: flex; gap: 8px; margin-top: 10px; }
    .comment-input { flex-grow: 1; padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; }
    .comment-btn { background: var(--primary); border: none; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
  </style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo-area" style="text-decoration: none; color: inherit;">
    <div class="brandmark">
      <img src="newlogo.webp" alt="Hive Nectar Logo" class="logo-img">
    </div>
    <span class="brand-title">HIVE NECTAR</span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
  </button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="pollenpop.html">PollenPop</a>
    <a href="join.html">Join the Hive</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="wrap">
    <section class="hero-card">
        <h1>Communication Board</h1>
        <p>Stay updated with the latest hive activity.</p>
    </section>

    <div class="filter-controls">
        <div id="recent-pill-container"></div>
        
        <div class="filter-dropdown-wrapper">
            <select id="categoryDropdown" class="category-select">
                <option value="" disabled selected hidden>Select Categories</option>
                <option value="all">All Categories</option>
                </select>
            <span id="dropdown-global-badge" class="notif-badge hidden"></span>
        </div>
    </div>

    <div id="dynamicBoard" class="board-container">
        </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a>
    <span>|</span>
    <a href="board.html">Communication Board</a>
  </div>
  <p>&copy; 2025 Hive Nectar. All rights reserved.</p>
</footer>

<script>
  //import { CommsManager } from './comms.js';

async function initBoard() {
    const posts = await CommsManager.fetchPosts();
    renderPills(posts);
    renderPosts(posts);
    updateNotificationBadges(posts);
}

function renderPills(posts) {
    const filterNav = document.querySelector('.filter-navigation');
    const types = ['all', ...new Set(posts.map(p => p.post_type))];
    
    filterNav.innerHTML = types.map(type => `
        <button class="pill ${type === 'all' ? 'active' : ''}" onclick="filterBy('${type}')">
            ${type.charAt(0).toUpperCase() + type.slice(1)}
            <span class="badge" id="badge-${type}"></span>
        </button>
    `).join('');
}

function updateNotificationBadges(posts) {
    const counts = {};
    posts.forEach(p => {
        counts[p.post_type] = (counts[p.post_type] || 0) + 1;
    });

    Object.keys(counts).forEach(type => {
        const badge = document.getElementById(`badge-${type}`);
        if (badge && counts[type] > 0) {
            badge.innerText = counts[type];
            badge.style.display = 'inline-block';
        }
    });
}

window.filterBy = async (type) => {
    const filtered = await CommsManager.fetchByType(type);
    renderPosts(filtered);
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
};

document.addEventListener('DOMContentLoaded', initBoard);
</script>

<div id="commsModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalData"></div>
        </div>
    </div>

 <script type="module" src="js/app.js"></script>
 
 <div id="global-loader" class="loader-overlay" style="display: none;">
    <div class="loader-content">
        <div class="buffering-icon"></div>
        <p id="loader-text">Fetching hive updates...</p>
    </div>
</div>
</body>
</html>
