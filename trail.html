<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trial Hub | The Meadow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="tester.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
</head>
<body class="page-trial" data-theme="classic">

<header class="header">
  <a href="index.html" class="logo-area">
    <div class="brandmark"><img src="newlogo.webp" alt="The Meadow Logo" class="logo-img"></div>
    <span class="brand-title">THE MEADOW</span>
  </a>
  <div id="authSection" class="user-area">
    <!-- dynamic: login button or user profile -->
  </div>
</header>

<main class="wrap">
  <!-- Login Overlay -->
  <div id="loginOverlay" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
    <div class="glass-card" style="max-width: 460px; width: 90%; padding: 40px; text-align: center;">
      <i class="fas fa-seedling" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
      <h2>Access Trial Hub</h2>
      <p class="tiny muted">Please log in to continue</p>
      <form id="trialLoginForm">
        <input type="email" id="loginEmail" placeholder="Email" required style="width: 100%; margin-bottom: 12px;">
        <input type="password" id="loginPassword" placeholder="Password" required style="width: 100%; margin-bottom: 24px;">
        <button type="submit" class="btn btn-success" style="width: 100%;">Log in</button>
      </form>
      <p class="tiny" style="margin-top: 20px;">Don't have an account? <a href="join.html">Join the Meadow</a></p>
    </div>
  </div>

  <!-- Dashboard (shown after login) -->
  <div id="dashboard" style="display: none;">
    <div class="dashboard-grid">
      <!-- LEFT SIDEBAR (dynamic) -->
      <aside class="glass-card">
        <div id="dynamicSidebar" class="sidebar-nav"><!-- loaded from Supabase --></div>
        <div class="trial-badge">
          <i class="fas fa-flask"></i> Trial Site Access (Closed)<br>
          <span class="tiny">Archive content – read only</span>
        </div>
      </aside>

      <!-- MAIN CONTENT (only the Explore button) -->
      <div class="glass-card" style="padding: 28px; display: flex; align-items: center; justify-content: center;">
        <div class="hero-minimal">
          <h1 style="font-size: 2rem; margin-bottom: 1rem;">Welcome to the Meadow</h1>
          <button id="exploreMainBtn" class="explore-btn">Explore My Journey <i class="fas fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-links"><a href="profile.html">My Profile</a> <span>|</span> <a href="board.html">Communication Board</a> <span>|</span> <a href="founders.html">Founders</a></div>
  <p>&copy; 2025 The Meadow. All rights reserved.</p>
</footer>

<script type="module" src="js/trial.js"></script>
</body>
</html>
