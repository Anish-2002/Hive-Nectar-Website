<body class="page-admin"data-theme="classic">

<header class="header">
  <a href="index.html" class="logo-area" style="text-decoration: none; color: inherit;">
    <div class="brandmark">
      <img src="newlogo.webp" alt="Hive Nectar Logo" class="logo-img">

</header>

    <div class="admin-container card">
        <h2>Post New Communication</h2>
        <input type="text" id="title" placeholder="Post Title">
        <textarea id="desc" placeholder="Post Description" rows="4"></textarea>
        <button class="btn" onclick="savePost()">Publish to Board</button>
        <hr>
        <button onclick="localStorage.removeItem('admin_comms'); alert('Cleared');" style="color:red; background:none; border:none; cursor:pointer;">Clear All Posts</button>
    </div>

<footer class="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a>
    <span>|</span>
    <a href="board.html">Communication Board</a>
  </div>
  <p>&copy; 2025 Hive Nectar. All rights reserved.</p>
</footer>

    <script>
        function savePost() {
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;

            let data = JSON.parse(localStorage.getItem('admin_comms')) || { "posts": [] };

            const newPost = {
                "id": Date.now().toString(),
                "title": title,
                "short_desc": desc,
                "created_at": new Date().toISOString(),
                "comments": []
            };

            data.posts.unshift(newPost);
            localStorage.setItem('admin_comms', JSON.stringify(data));

            alert("Post Published!");
            document.getElementById('title').value = '';
            document.getElementById('desc').value = '';
        }
    </script>
</body>
</html>
