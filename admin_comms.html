<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin - Create Buzz</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-container { max-width: 500px; margin: 50px auto; padding: 20px; }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
  </style>
</head>
<body>
    <div class="admin-container card">
        <h2>Post New Communication</h2>
        <input type="text" id="title" placeholder="Post Title">
        <textarea id="desc" placeholder="Post Description" rows="4"></textarea>
        <button class="btn" onclick="savePost()">Publish to Board</button>
        <hr>
        <button onclick="localStorage.removeItem('admin_comms'); alert('Cleared');" style="color:red; background:none; border:none; cursor:pointer;">Clear All Posts</button>
    </div>

    <script>
        function savePost() {
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;

            // Get current data or create the structure if empty
            let data = JSON.parse(localStorage.getItem('admin_comms')) || { "posts": [] };

            const newPost = {
                "id": Date.now().toString(),
                "title": title,
                "short_desc": desc,
                "created_at": new Date().toISOString(),
                "comments": []
            };

            // Add to the start of the array
            data.posts.unshift(newPost);

            // Save back to "Local JSON"
            localStorage.setItem('admin_comms', JSON.stringify(data));

            alert("Post Published!");
            document.getElementById('title').value = '';
            document.getElementById('desc').value = '';
        }
    </script>
</body>
</html>
