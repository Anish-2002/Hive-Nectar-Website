<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8" />
  <title>New Password | The Meadow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-faq"data-theme="classic">

<header class="header">
  <a href="index.html" class="logo-area" style="text-decoration: none; color: inherit;">
    <div class="brandmark">
      <img src="newlogo.webp" alt="The Meadow Logo" class="logo-img">
    </div>
    <span class="brand-title">THE MEADOW</span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
  </button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="pollenpop.html">PollenPop</a>
    <a href="the-meadow.html">The Meadow</a>
    <a href="board.html">Communication Board</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login to Pollen Pop</a>
  </nav>
</header>

  <main class="wrap">
    <div style="max-width: 400px; margin: 40px auto;">
        <section class="card" id="resetForm">
          <h2 class="section-title">Set New Password</h2>
          <p class="tiny" style="margin-bottom: 20px;">Please enter your new secure password below.</p>
          
          <div style="margin-bottom: 20px;">
              <label class="tiny" style="display:block; margin-bottom:5px;">New Password</label>
              <input type="password" id="newPassword" required style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
          </div>

          <button id="updateBtn" class="btn" style="width:100%; color:white; border:none; padding:12px; cursor:pointer; border-radius:8px;">Update Password</button>
        </section>
    </div>
  </main>

<footer class="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a> <span>|</span> <a href="founders.html">Founders</a>
  </div>
  <p>&copy; 2025 The Meadow. All rights reserved.</p>
</footer>

 <script type="module">
    import { supabase } from './js/supabase-config.js';
    import { showToast } from './js/app.js';

    const btn = document.getElementById('updateBtn');
    const pwInput = document.getElementById('newPassword');

    // Show form immediately — Supabase SDK handles session from URL hash

    btn.addEventListener('click', async () => {
        const newPassword = pwInput.value;

        if (!newPassword || newPassword.length < 6) {
            showToast('Password must be at least 6 characters.', 'error');
            return;
        }

        btn.innerText = 'Updating...';
        btn.disabled = true;

        const { error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) {
            showToast(error.message, 'error');
            btn.innerText = 'Update Password';
            btn.disabled = false;
        } else {
            showToast('Password updated! Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
    });
</script>
</body>
</html>
