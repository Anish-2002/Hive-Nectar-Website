<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>New Password | Hive Nectar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <a href="index.html" class="logo-area" style="text-decoration: none; color: inherit;">
    <div class="brandmark">
      <img src="newlogo.webp" alt="Hive Nectar Logo" class="logo-img">
    </div>
    <span class="brand-title">HIVE NECTAR</span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
  </button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="pollenpop.html">PollenPop</a>
    <a href="join.html">Join the Hive</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

  <main class="wrap">
    <div style="max-width: 400px; margin: 40px auto;">
        <section class="card">
          <h2 class="section-title">Set New Password</h2>
          <p class="tiny" style="margin-bottom: 20px;">Please enter your new secure password below.</p>
          
          <div style="margin-bottom: 20px;">
              <label class="tiny" style="display:block; margin-bottom:5px;">New Password</label>
              <input type="password" id="newPassword" required style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
          </div>

          <button id="updateBtn" class="btn" style="width:100%; background: var(--cta); color:white; border:none; padding:12px; cursor:pointer; border-radius:8px;">Update Password</button>
        </section>
    </div>
  </main>

<footer class="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a>
    <span>|</span>
    <a href="board.html">Communication Board</a>
  </div>
  <p>&copy; 2025 Hive Nectar. All rights reserved.</p>
</footer>

 <script type="module">
    import { supabase } from './js/supabase-config.js';
    import { showToast } from './js/app.js';
    
    document.getElementById('updateBtn').addEventListener('click', async () => {
        const btn = document.getElementById('updateBtn');
        const newPassword = document.getElementById('newPassword').value;

        if (!newPassword) {
            showToast("Please enter a new password.", "error");
            return;
        }

        btn.innerText = "Updating...";
        btn.disabled = true;

        const { error } = await supabase.auth.updateUser({ password: newPassword });
        
        if (error) {
            showToast(error.message, "error");
            btn.innerText = "Update Password";
            btn.disabled = false;
        } else {
            showToast("Password updated! Redirecting to login...", "success");
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
    });
</script>
</body>
</html>
