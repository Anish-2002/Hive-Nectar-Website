<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trophy Studio | The Meadow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        body[data-theme="classic"] { --bg: #fdfdfb; --card: #ffffff; --fg: #1e293b; --border: #e2e8f0; --primary: #facc15; }
        body[data-theme="gold"] { --bg: #fefce8; --card: #fef9c3; --fg: #713f12; --border: #fde047; --primary: #eab308; }
        body[data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --fg: #29ca72; --border: #334155; --primary: #facc15; }

        body { 
            margin: 0; background: var(--bg); color: var(--fg); 
            font-family: 'Segoe UI', sans-serif; height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        
        header { 
            background: #1e293b; color: white; padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
            flex-shrink: 0;
        }
        .brand { font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; font-size: 1rem; }
        .back-btn { color: white; text-decoration: none; font-size: 0.8rem; background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px; }

        .studio-container { 
            display: flex; 
            flex: 1; 
            flex-direction: row;
            overflow: hidden; 
        }

        #workspace { 
            flex-grow: 1; 
            position: relative; 
            background: radial-gradient(circle, var(--card) 0%, var(--bg) 100%); 
            touch-action: none;
        }

        #inventory { 
            width: 320px; 
            background: var(--card); 
            border-left: 1px solid var(--border); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            overflow-y: auto;
            z-index: 10;
        }

        @media (max-width: 900px) {
            .studio-container { 
                flex-direction: column;
            }
            #inventory { 
                width: 100%; 
                height: 45%;
                border-left: none; 
                border-top: 1px solid var(--border);
                padding: 15px;
                box-sizing: border-box;
            }
            #workspace {
                height: 55%;
            }
            .decoration-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) !important;
            }
        }

        .section-title { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: #888; margin-bottom: 10px; display: block; }
        
        .decoration-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .deco-item {
            background: var(--bg); border: 2px solid var(--border); border-radius: 12px;
            padding: 15px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .deco-item.active { border-color: var(--primary); background: rgba(250, 204, 21, 0.1); }
        .deco-item i { font-size: 1.5rem; display: block; margin-bottom: 5px; }

        .control-group { background: var(--bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        input[type="range"] { width: 100%; accent-color: var(--primary); margin: 10px 0; }
        input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 8px; cursor: pointer; background: none; }

        .save-btn { 
            margin-top: auto; padding: 15px; background: var(--primary); color: #000; 
            border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body data-theme="classic">

<header class="header">
  <a href="index.html" class="logo-area" style="text-decoration: none; color: inherit;">
    <div class="brandmark">
      <img src="newlogo.webp" alt="The Meadow Logo" class="logo-img">
    </div>
    <span class="brand-title">THE MEADOW</span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
  </button>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="pollenpop.html">PollenPop</a>
    <a href="join.html">Join the Meadow</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login to Meadow</a>
  </nav>
</header>

<div class="studio-container">
    <main id="workspace"></main>

    <aside id="inventory">
        <div>
            <span class="section-title">Select Item</span>
            <div class="decoration-grid">
                <div class="deco-item active" onclick="selectDeco('tie.glb')">
                    <i class="fas fa-ribbon"></i>
                    <span style="font-size: 11px;">Standard Tie</span>
                </div>
                <div class="deco-item" style="opacity: 0.5; cursor: not-allowed;">
                    <i class="fas fa-star"></i>
                    <span style="font-size: 11px;">Locked</span>
                </div>
            </div>
        </div>

        <div class="control-group">
            <span class="section-title">Adjustments</span>
            <label style="font-size: 11px;">Scale</label>
            <input type="range" id="tieScale" min="0.5" max="5" value="1" step="0.1">
            
            <label style="font-size: 11px;">Item Color</label>
            <input type="color" id="tieColor" value="#ff0000">
        </div>

        <div class="control-group">
            <span class="section-title">Jar Base</span>
            <input type="color" id="jarColor" value="#ffffff">
        </div>

        <button class="save-btn" id="exportBtn"><i class="fas fa-check-circle"></i> Save to Profile</button>
    </aside>
</div>

<footer class="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a>
    <span>|</span>
    <a href="board.html">Communication Board</a> <span>|</span> <a href="founders.html">Founders</a>
  </div>
  <p>&copy; 2025 The Meadow. All rights reserved.</p>
</footer>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    document.body.setAttribute('data-theme', localStorage.getItem('meadow-theme') || localStorage.getItem('hive-theme') || 'classic');

    const scene = new THREE.Scene();
    const workspace = document.getElementById('workspace');
    
    const camera = new THREE.PerspectiveCamera(45, workspace.offsetWidth / workspace.offsetHeight, 0.1, 1000);
    camera.position.set(0, 0.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(workspace.offsetWidth, workspace.offsetHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    workspace.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(2, 2, 5);
    scene.add(light);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;

    let jar, currentDeco;
    const loader = new GLTFLoader();

    loader.load('honey_jar.glb', (gltf) => {
        jar = gltf.scene;
        jar.position.y = -0.5;
        scene.add(jar);
    });

    window.selectDeco = function(file) {
        if (currentDeco) scene.remove(currentDeco);
        loader.load(file, (gltf) => {
            currentDeco = gltf.scene;
            currentDeco.position.set(0, 0, 0.8);
            scene.add(currentDeco);
            
            const drag = new DragControls([currentDeco], camera, renderer.domElement);
            drag.addEventListener('dragstart', () => orbit.enabled = false);
            drag.addEventListener('dragend', () => orbit.enabled = true);
        });
    };
    selectDeco('tie.glb');

    document.getElementById('tieColor').addEventListener('input', (e) => {
        if(currentDeco) currentDeco.traverse(c => { if(c.isMesh) c.material.color.set(e.target.value); });
    });

    document.getElementById('jarColor').addEventListener('input', (e) => {
        if(jar) jar.traverse(c => { if(c.isMesh) c.material.color.set(e.target.value); });
    });

    document.getElementById('tieScale').addEventListener('input', (e) => {
        if(currentDeco) {
            const s = parseFloat(e.target.value);
            currentDeco.scale.set(s, s, s);
        }
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
        renderer.render(scene, camera);
        const imgData = renderer.domElement.toDataURL("image/png");
        localStorage.setItem('achievementEmoji', imgData);
        alert("Success! Your trophy is saved.");
        window.location.href = 'profile.html';
    });

    function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        const w = workspace.offsetWidth;
        const h = workspace.offsetHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });
</script>
</body>
</html>
