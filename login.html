<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | Hive Nectar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .auth-container {
      min-height: calc(100vh - 200px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      box-shadow: var(--card-shadow-hover);
      border: 1px solid var(--border);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header .icon-circle {
      width: 80px;
      height: 80px;
      background: var(--honey-gradient);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2rem;
      color: white;
      box-shadow: var(--honey-glow);
    }
    
    .auth-header h2 {
      margin: 0 0 8px;
    }
    
    .auth-header p {
      margin: 0;
      color: var(--fg-muted);
    }
    
    .form-field {
      margin-bottom: 20px;
    }
    
    .form-field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--fg);
    }
    
    .form-field .input-wrapper {
      position: relative;
    }
    
    .form-field .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--fg-muted);
    }
    
    .form-field input {
      padding-left: 48px;
    }
    
    .forgot-link {
      display: block;
      text-align: right;
      margin-top: -12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-dark);
    }
    
    .forgot-link:hover {
      color: var(--primary);
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }
    
    .auth-footer p {
      margin: 0;
      font-size: 0.9rem;
    }
    
    .auth-footer a {
      font-weight: 700;
      color: var(--primary-dark);
    }
    
    #loginError {
      background: var(--error-light);
      color: var(--error);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
    
    #loginError.show {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body data-theme="classic">

<header class="header" data-testid="main-header">
  <a href="index.html" class="logo-area" data-testid="logo-link">
    <div class="brandmark">
      <img src="newlogo.webp" alt="Hive Nectar Logo" class="logo-img">
    </div>
    <span class="brand-title">HIVE NECTAR</span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu" data-testid="menu-toggle">
    <i class="fas fa-bars"></i>
  </button>
  <nav class="nav-links" id="navLinks" data-testid="nav-links">
    <a href="index.html">Home</a>
    <a href="pollenpop.html">PollenPop</a>
    <a href="join.html">Join the Hive</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="auth-container">
  <div class="auth-card" data-testid="login-card">
    <div class="auth-header">
      <div class="icon-circle">
        <i class="fas fa-user"></i>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to continue your journey</p>
    </div>
    
    <form id="loginForm" data-testid="login-form">
      <div id="loginError" data-testid="login-error">
        <i class="fas fa-exclamation-circle"></i>
        <span></span>
      </div>
      
      <div class="form-field">
        <label for="loginEmail">Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" id="loginEmail" required placeholder="you@example.com" data-testid="login-email">
        </div>
      </div>
      
      <div class="form-field">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" id="loginPassword" required placeholder="Enter your password" data-testid="login-password">
        </div>
      </div>
      
      <a href="forgot-password.html" class="forgot-link" data-testid="forgot-password-link">Forgot password?</a>
      
      <button type="submit" class="btn" style="width: 100%;" data-testid="login-submit">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Don't have an account? <a href="join.html" data-testid="signup-link">Sign up</a></p>
    </div>
  </div>
</main>

<footer class="footer" data-testid="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a>
    <span>|</span>
    <a href="board.html">Communication Board</a>
  </div>
  <p>&copy; 2025 Hive Nectar. All rights reserved.</p>
</footer>

<script type="module" src="js/app.js"></script>

<div id="global-loader" class="loader-overlay" style="display: none;">
  <div class="loader-content">
    <div class="buffering-icon"></div>
    <p id="loader-text">Loading...</p>
  </div>
</div>

</body>
</html>
