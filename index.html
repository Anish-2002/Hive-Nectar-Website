<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 8c14 22 30 38 30 52a30 30 0 0 1-60 0C20 46 36 30 50 8z' fill='%23D9A441'/><circle cx='41' cy='58' r='6' fill='%23FFF3D6' opacity='.75'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      These two are the *only* sheets every original page shares (23 of 24 link
      style.css; 18 of 24 link Font Awesome). They are declared on the shell so
      the very first paint is never unstyled, and tagged `data-shell-css` so
      src/lib/legacy.js can switch them OFF for the pages that do not declare
      them — preview.html is a Tailwind-only document that links neither, and
      must not inherit the site theme.
    -->
    <link rel="stylesheet" href="/style.css" data-shell-css="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      data-shell-css="font-awesome"
    />
    <!--
      Profile PWA. The manifest scope is /profile.html, so only that page is
      installable and only that page is ever served from the worker's cache.
      Declared on the shell because the legacy documents are mounted at runtime
      and only their stylesheets are injected into <head>.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3F6B4F" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meadow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>The Meadow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
