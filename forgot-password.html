<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password | Hive Nectar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <header class="header">
    <div class="logo-area">
      <div class="brandmark"><img src="logo.svg" alt="" style="width:20px;"></div>
      <span class="brand-title">HIVE NECTAR</span>
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="join.html">Join the Hive</a>
    </nav>
  </header>

  <main class="wrap">
    <div style="max-width: 400px; margin: 40px auto;">
        <section class="card">
          <h2 class="section-title">Forgot Password</h2>
          <p class="tiny" style="margin-bottom: 20px;">Enter your email to receive a secure reset link.</p>
          
          <form id="forgotPasswordForm">
            <div style="margin-bottom: 20px;">
              <label class="tiny" style="display:block; margin-bottom:5px;">Email Address</label>
              <input type="email" id="resetEmail" required style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
            </div>
            
            <p id="resetMessage" class="tiny" style="margin-bottom: 15px; display: none;"></p>

            <button type="submit" id="sendLinkBtn" class="btn" style="width:100%; background: var(--cta); color:white; border:none; padding:12px; cursor:pointer; border-radius:8px;">Send Reset Link</button>
          </form>
          
          <p class="tiny" style="margin-top: 20px; text-align: center;">
            Remembered your password? <a href="login.html" class="text-link">Back to Login</a>
          </p>
        </section>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Hive Nectar. All rights reserved.</p>
  </footer>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
