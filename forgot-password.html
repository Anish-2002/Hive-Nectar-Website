<header class="header">
  <a href="index.html" class="logo-area" style="text-decoration: none; color: inherit;">
    <div class="brandmark">
      <img src="newlogo.webp" alt="The Meadow Logo" class="logo-img">
    </div>
    <span class="brand-title">THE MEADOW</span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>

  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>

  <main class="wrap">
    <div style="max-width: 400px; margin: 40px auto;">
        <section class="card">
          <h2 class="section-title">Forgot Password</h2>
          <p class="tiny" style="margin-bottom: 20px;">Enter your email to receive a secure reset link.</p>
          
          <form id="forgotPasswordForm">
            <div style="margin-bottom: 20px;">
              <label class="tiny" style="display:block; margin-bottom:5px;">Email Address</label>
              <input type="email" id="resetEmail" required style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
            </div>
            
            <p id="resetMessage" class="tiny" style="margin-bottom: 15px; display: none;"></p>

            <button type="submit" id="sendLinkBtn" class="btn" style="width:100%; color:white; border:none; padding:12px; cursor:pointer; border-radius:8px;">Send Reset Link</button>
          </form>
          
          <p class="tiny" style="margin-top: 20px; text-align: center;">
            Remembered your password? <a href="login.html" class="text-link">Back to Login</a>
          </p>
        </section>
    </div>
  </main>
