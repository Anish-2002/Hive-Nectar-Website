<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Achievements | The Meadow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="page-admin" data-loading data-theme="classic">

<header class="header">
  <a href="the-meadow.html" class="logo-area" style="text-decoration: none; color: inherit;">
    <div class="brandmark">
      <img src="newlogo.webp" alt="The Meadow Logo" class="logo-img">
    </div>
    <span class="brand-title">THE MEADOW</span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
  </button>
  <nav class="nav-links" id="navLinks">
    <a href="the-meadow.html">The Meadow</a>
    <a href="admin-crm.html">CRM</a>
    <a href="pollenpop.html">PollenPop</a>
    <a href="board.html">Communication Board</a>
    <a href="faq.html">FAQ</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<main class="wrap" style="max-width: 1100px; margin: 40px auto; padding: 0 20px;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h1 style="margin: 0; font-size: 1.4rem;">
      <i class="fas fa-trophy" style="color: var(--primary); margin-right: 10px;"></i>
      Achievements Manager
    </h1>
    <span id="adminEmail" class="tiny muted"></span>
  </div>

  <!-- Milestones Table -->
  <div class="card" style="margin-bottom: 30px;">
    <h2 class="section-title" style="margin-bottom: 20px;">
      Milestones
      <span id="milestonesCount" class="tiny muted" style="margin-left: 10px;"></span>
    </h2>
    <div style="overflow-x: auto;">
      <table class="crm-table" style="width: 100%; font-size: 0.85rem;">
        <thead>
          <tr>
            <th style="width: 50px;">#</th>
            <th>Name</th>
            <th>Category</th>
            <th>Required</th>
            <th style="width: 100px; text-align: center;">Active</th>
          </tr>
        </thead>
        <tbody id="milestonesBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Tokens Table -->
  <div class="card">
    <h2 class="section-title" style="margin-bottom: 20px;">
      Theme Tokens
      <span id="tokensCount" class="tiny muted" style="margin-left: 10px;"></span>
    </h2>
    <div style="overflow-x: auto;">
      <table class="crm-table" style="width: 100%; font-size: 0.85rem;">
        <thead>
          <tr>
            <th style="width: 50px;">#</th>
            <th>Name</th>
            <th>Theme</th>
            <th>Stage</th>
            <th>Tasks Required</th>
            <th style="width: 100px; text-align: center;">Active</th>
          </tr>
        </thead>
        <tbody id="tokensBody"></tbody>
      </table>
    </div>
  </div>

</main>

<footer class="footer">
  <div class="footer-links">
    <a href="profile.html">My Profile</a> <span>|</span> <a href="founders.html">Founders</a>
  </div>
  <p>&copy; 2025 The Meadow. All rights reserved.</p>
</footer>

<div id="toast-container"></div>

<script type="module" src="js/admin-achievements.js"></script>
<div id="global-loader" class="loader-overlay" style="display: none;">
  <div class="loader-content"><div class="buffering-icon"></div><p id="loader-text">Loading...</p></div>
</div>
</body>
</html>
