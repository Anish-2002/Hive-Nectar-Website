<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Tint Theme Tester | Hive Nectar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-page: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Control Panel */
        .tester-controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #e2e8f0;
        }

        /* --- THE SOFT TINT CARD --- */
        #testCard {
            width: 100%;
            max-width: 350px;
            padding: 30px;
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02);
        }

        .icon-box {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h2 { margin: 0; font-size: 1.5rem; transition: color 0.3s; }
        p { margin: 0; line-height: 1.6; color: var(--text-muted); }

        .btn-action {
            margin-top: 10px;
            border: none;
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            cursor: pointer;
            background: none;
        }
    </style>
</head>
<body>

    <div class="tester-controls">
        <strong>Pick a DB Color:</strong>
        <input type="color" id="dbColorPicker" value="#F59E0B">
        <span id="hexCode">#F59E0B</span>
    </div>

    <div id="testCard">
        <div class="icon-box" id="cardIcon">
            <i class="fas fa-rocket"></i>
        </div>
        <h2 id="cardTitle">Mission: Hive Buzz</h2>
        <p>This mission uses the "Soft Tint" professional look. The background and border are calculated dynamically from your database color.</p>
        <button class="btn-action" id="cardBtn">Start Mission</button>
    </div>

    <script>
        const picker = document.getElementById('dbColorPicker');
        const hexText = document.getElementById('hexCode');
        const card = document.getElementById('testCard');
        const title = document.getElementById('cardTitle');
        const icon = document.getElementById('cardIcon');
        const btn = document.getElementById('cardBtn');

        // Professional Helper: Converts Hex to RGBA
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Professional Helper: Darkens a color for text readability
        function adjustBrightness(hex, magnitude) {
            hex = hex.replace(`#`, ``);
            if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            
            r = Math.max(0, Math.min(255, r + magnitude));
            g = Math.max(0, Math.min(255, g + magnitude));
            b = Math.max(0, Math.min(255, b + magnitude));
            
            return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
        }

        function updateTheme(color) {
            hexText.innerText = color.toUpperCase();
            
            // 1. Set background to 8% opacity
            card.style.backgroundColor = hexToRgba(color, 0.08);
            
            // 2. Set border to 25% opacity
            card.style.border = `1px solid ${hexToRgba(color, 0.25)}`;
            
            // 3. Set Icon to full strength
            icon.style.color = color;
            
            // 4. Set Title to a darkened version of the theme (for contrast)
            title.style.color = adjustBrightness(color, -80);
            
            // 5. Set Button to full strength
            btn.style.backgroundColor = color;
        }

        // Listen for changes
        picker.addEventListener('input', (e) => {
            updateTheme(e.target.value);
        });

        // Initialize
        updateTheme(picker.value);
    </script>
</body>
</html>
