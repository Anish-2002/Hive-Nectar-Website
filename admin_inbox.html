  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function renderInbox() {
        const container = document.getElementById('inboxContainer');
        const inquiries = JSON.parse(localStorage.getItem('hive_inquiries')) || [];
        
        if (inquiries.length === 0) {
            container.innerHTML = '<p>No messages received yet.</p>';
            return;
        }

        container.innerHTML = inquiries.map(iq => `
            <div class="card" style="margin-bottom: 15px;">
                <div style="display: flex; justify-content: space-between;">
                    <strong>${escapeHtml(iq.category)}</strong>
                    <span class="tiny muted">${escapeHtml(iq.timestamp)}</span>
                </div>
                <h3 style="margin: 10px 0;">From: ${escapeHtml(iq.name)}</h3>
                <p class="muted">${escapeHtml(iq.message)}</p>
                <div class="tiny" style="color: var(--cta)">${escapeHtml(iq.email)}</div>
            </div>
        `).join('');
    }
    renderInbox();
  </script>
</body>
</html>
