<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Inbox | Hive Nectar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>Inquiry Inbox</h1>
    <div id="inboxContainer"></div>
  </main>

  <script>
    function renderInbox() {
        const container = document.getElementById('inboxContainer');
        const inquiries = JSON.parse(localStorage.getItem('hive_inquiries')) || [];
        
        if (inquiries.length === 0) {
            container.innerHTML = '<p>No messages received yet.</p>';
            return;
        }

        container.innerHTML = inquiries.map(iq => `
            <div class="card" style="margin-bottom: 15px;">
                <div style="display: flex; justify-content: space-between;">
                    <strong>${iq.category}</strong>
                    <span class="tiny muted">${iq.timestamp}</span>
                </div>
                <h3 style="margin: 10px 0;">From: ${iq.name}</h3>
                <p class="muted">${iq.message}</p>
                <div class="tiny" style="color: var(--cta)">${iq.email}</div>
            </div>
        `).join('');
    }
    renderInbox();
  </script>
</body>
</html>
